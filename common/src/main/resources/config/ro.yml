# Configurația principală GrimAC
# Cod sursă: https://github.com/MWHunter/Grim
# Drepturi de autor 2025 DefineOutside și colaboratorii, licențiat sub GPLv3.
# Binarele modificate sau pluginurile cu cod Grim copiat trebuie să fie private,
# sau cu întregul cod sursă disponibil cumpărătorilor fără costuri suplimentare.

alerts:
    # SparkGrim Phase 3 only aggregates normal staff alerts; internal flags, logs, history and /grim verbose stay complete.
    enabled: true
    aggregation: true
    burst-summary: true
    cooldown-ms: 1500
    minimum-vl-gap: 5
    state-retention-seconds: 600
    milestones:
        - "1"
        - "5"
        - "10"
        - "15"
        - "20"
    severity:
        medium: 4.0
        high: 8.0
        critical: 14.0
    # Pe lângă transmiterea alertelor către jucători, ar trebui să fie trimise și în consolă?
    print-to-console: true
    # Această opțiune controlează dacă/și cum sunt partajate alertele între serverele conectate la proxy.
    # Trebuie să ai 'bungee-plugin-message-channel' activat în configurația Velocity dacă Velocity este folosit.
    proxy:
        # Ar trebui ca alertele să fie trimise către alte servere conectate la proxy?
        send: false
        # Ar trebui ca alertele primite de la alte servere să fie anunțate pe acest server?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Acest lucru înseamnă că nu va transmite operatorilor brandul clientului dacă brandul se potrivește cu regex-urile de mai jos
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim va bloca anumite versiuni Forge care includ hackuri Reach integrate (Forge 1.18.2 până la 1.19.3).
    # Setarea acestei opțiuni la false va permite acestor clienți să se conecteze la server. Dezactivează pe propriul risc.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ascunde toți spectatorii cu permisiunea grim.spectator indiferent dacă spectează activ sau nu
    hide-regardless: false
    # Va face spectatorii invizibili doar în aceste lumi, lasă gol pentru a permite în toate lumile
    allowed-worlds:
        - ""

# Cât timp au jucătorii până să fie deconectați pentru timeout? Implicit = 60 secunde
max-transaction-time: 60

# Activează pentru a opri Grim din a anula pongs primite de la jucători.
# Poate îmbunătăți compatibilitatea cu alte anticheaturi. Poate cauza probleme cu limitatoarele de pachete.
# Nu activa dacă nu ești sigur ce faci.
disable-pong-cancelling: false

# Ar trebui dezactivat handler-ul implicit de resincronizare a blocurilor?
# Implicit, Grim citește blocurile din lumea serverului și le trimite clientului pentru a repara desincronizarea.
# Dacă utilizați plugin-uri care creează blocuri false bazate pe pachete (care nu există în lumea serverului),
# ar trebui să setați acest lucru pe true pentru a preveni ca Grim să le suprascrie cu aer/blocuri reale.
# Acest lucru forțează utilizarea unui handler "NoOp" (Fără Operațiune), cu excepția cazului în care unul personalizat este furnizat prin API.
disable-default-resync-handler: false

# Ar trebui să fie anulat pachetul de mișcare duplicat?
# Mojang a reparat această problemă în 1.21. A fost încercarea lor de a rezolva „bucket desync”. https://bugs.mojang.com/browse/MC-12363
# Această setare se aplică doar clienților 1.17-1.20.5 pe servere 1.8.
cancel-duplicate-packet: true

# Dacă să se ignore rotația în pachetele duplicate
ignore-duplicate-packet-rotation: false

Simulation:
    # Cu cât ar trebui să înmulțim avantajul total atunci când jucătorul este legitim
    # Așa arată configurația implicită (axa X = secunde, axa Y = 1/1000 bloc): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Cât de mare trebuie să fie abaterea de la mișcarea jucătorului pentru a crea o încălcare?
    # Măsurat în blocuri față de mișcarea posibilă
    # Luăm în considerare Optifine schimbând tabelele trig, dar scăderea la 0.001 va reduce FastMath
    # și ar putea marca anticheatul dacă această compensație nu funcționează...
    threshold: 0.001
    # Cât de mare trebuie să fie încălcarea într-un tick pentru a da setback imediat?
    # -1 pentru a dezactiva
    immediate-setback-threshold: 0.1
    # Cât de mare este avantajul acumulat înainte de a aplica setback-ul?
    # -1 pentru a dezactiva
    max-advantage: 1
    # După 50 de secunde cu setările implicite, jucătorul va trece de la 4 blocuri -> 1 bloc avantaj
    # Aceasta previne acumularea prea multor încălcări fără șansă de reset
    # Grafic implicit avantaj (axa X = secunde, axa Y = 1/1000 bloc): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Pragul de încălcare pentru setback
    # 1 pentru comportamentul vechi
    setback-violation-threshold: 1

# Verifică dacă un jucător a intrat într-un bloc în timpul mișcării
Phase:
    setbackvl: 1 # Glitch-ul în blocuri poate permite escaladarea pereților, iar acest check e relativ stabil
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Verificare NoSlow bazată pe predicție
# Grim ține cont de netcode-ul buguit aici... greu de generat fals pozitive, chiar și când apeși repetat click dreapta și butonul pentru mâna secundară
# Mult mai stabil decât alte anticheaturi, dar raportează orice fals-pozitiv... am reparat multe probleme de netcode aici.
NoSlow:
    # Cât de mare abatere e considerată „cheating”
    # Implicit este mai mică decât alte offs
    # Marchează între 0.03-0.2 constant cu NoSlow activ
    threshold: 0.001
    # Setback rapid la primul obiect pentru a elimina orice avantaj dat de NoSlow
    setbackvl: 5
    # Scade atunci când jucătorul folosește un item ȘI este încetinit de acesta
    decay: 0.05

Knockback:
    # Cu cât ar trebui să înmulțim avantajul total atunci când jucătorul este legitim
    setback-decay-multiplier: 0.999
    # Cât de mare trebuie să fie abaterea față de viteza jucătorului pentru a crea o încălcare?
    # Măsurat în blocuri față de viteza posibilă
    threshold: 0.001
    # Cât de mare trebuie să fie încălcarea într-un tick pentru setback imediat?
    # -1 pentru a dezactiva
    immediate-setback-threshold: 0.1
    # Cât de mare este avantajul acumulat înainte de a aplica setback-ul?
    # -1 pentru a dezactiva
    max-advantage: 1
    # Previne acumularea prea multor încălcări imposibil de resetat
    max-ceiling: 4

    # v22: AntiKB owns velocity mitigation instead of teleporting the player.
    enforcement:
        enabled: true
        cooldown-ms: 120
        recovery-ms: 350
        episode-reset-ms: 1200
        max-retries: 2
        minimum-reapply-scale: 0.35
        suppress-in-special-environments: true

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milisecunde pe care jucătorul le poate acumula pentru o utilizare ulterioară când rămâne în urmă
    # Poate permite bypass-uri fast use/fast heal/fast bow pe 1.8 dacă e setat prea mare, 120 ms e un echilibru bun
    drift: 120

# Acest check limitează abuzul TimerA prevenind rămânerea în urmă a mișcării față de timpul real
TimerLimit:
    # Ping la care check-ul începe să limiteze balanța timer, pentru a preveni abuzul.
    # Poate cauza setback pentru jucători legitimi doar dacă sunt peste acest prag de ping.
    # -1 pentru a dezactiva
    ping-abuse-limit-threshold: 1000

    hard-prevention:
        # TimerA already cancels pure Timer abuse. This layer may cancel movement
        # when Blink/PacketBurst evidence exists, but Blink rollback is owned only
        # by ConnectionStall's one-shot hard-release barrier.
        enabled: true
        cancel-movement: true
        minimum-confidence: 0.55
        causal-window-ms: 1500
NegativeTimer:
    # Număr de milisecunde pierdute în timp ce se mișcă înainte de a începe să marcheze
    drift: 1200

# Aceeași metodă de verificare ca TimerA, dar pentru vehicule
# Protects movement integrity when a client stops sending movement packets while the connection remains alive.
# This also powers combat-tag preservation during suspicious/ambiguous stalls.
integrity-profile: balanced

# Phase 4B Blink mitigation. Full connection freezes remain ambiguous; selective stalls require transaction progress.
blink-mitigation:
    enabled: true
    profile: balanced
    hard-release:
        # v20: a single movement gap NEVER causes a rollback by itself.
        # The first packet only arms a candidate; a second movement packet must arrive
        # inside burst-confirm-max-interval-ms to prove a compressed Blink release.
        enabled: true
        legacy-min-gap-ms: 120
        modern-min-gap-ms: 700
        max-gap-ms: 1600
        min-transaction-advance: 1
        minimum-confidence: 0.80
        burst-confirm-max-interval-ms: 35
        # Only the buffered tail is discarded. Accepted movement resumes immediately
        # after this short window; no repeated setback is allowed during recovery.
        cancel-window-ms: 180
        recovery-no-setback-ms: 600
        setback: true
        # A single confirmed release is prevention first. Repeated confirmed releases
        # become ConnectionStall evidence and can be sanctioned through punishments.yml.
        flag-after-repeats: 3
        repeat-window-ms: 8000
        flag-cooldown-ms: 3000
    recovery:
        max-ms: 8000
        min-movement-packets: 8
        min-transaction-advance: 2
    profiles:
        safe:
            legacy-watch-gap-ms: 450
            modern-watch-gap-ms: 1500
            airborne-watch-gap-ms: 650
            confirm-gap-ms: 1200
            min-transaction-advance: 5
            release-guard-min-gap-ms: 1400
            release-guard-min-transactions: 5
            release-guard-repeat-threshold: 3
            protect-full-freeze-airborne: false
        balanced:
            legacy-watch-gap-ms: 350
            modern-watch-gap-ms: 1200
            airborne-watch-gap-ms: 500
            confirm-gap-ms: 900
            min-transaction-advance: 3
            release-guard-min-gap-ms: 1000
            release-guard-min-transactions: 3
            release-guard-repeat-threshold: 2
            protect-full-freeze-airborne: false
        lockdown:
            legacy-watch-gap-ms: 300
            modern-watch-gap-ms: 900
            airborne-watch-gap-ms: 400
            confirm-gap-ms: 700
            min-transaction-advance: 2
            release-guard-min-gap-ms: 750
            release-guard-min-transactions: 2
            release-guard-repeat-threshold: 1
            protect-full-freeze-airborne: false

# Uses Grim's existing safe setback position once, only when a selective Blink release has enough evidence.
movement-release-guard:
    enabled: true
    cooldown-ms: 500
    retention-seconds: 120

movement-context-auto:
    enabled: true
    velocity-duration-ms: 900
    teleport-duration-ms: 1200
    cancelled-move-duration-ms: 300
    flight-duration-ms: 3000

ConnectionStall:
    enabled: true
    # Legacy 1.8 clients normally send a flying packet every tick, even while standing still.
    legacy-watch-gap-ms: 350
    # Modern clients may legally skip more movement packets while idle.
    modern-watch-gap-ms: 1200
    # Airborne gaps are more dangerous because they can suspend falling.
    airborne-watch-gap-ms: 500
    # A stall only becomes a cheat signal after this gap AND enough transaction replies continue.
    confirm-gap-ms: 900
    # Preserve historical combat on quit even if the final stall is shorter than the normal watch threshold.
    disconnect-protect-gap-ms: 150
    # Freeze combat time even for short sub-threshold stalls; this is protection only, not a cheat flag.
    combat-hold-gap-ms: 150
    modern-combat-hold-gap-ms: 500
    min-transaction-advance: 3
    # Full connection freezes can look legitimate, so this mitigates long airborne stalls without flagging them.
    ambiguous-airborne-setback-ms: 1500
    # Movement must remain clean this long before a protected combat tag resumes counting down.
    recovery-clean-ms: 2000
    flag-cooldown-ms: 3000
    join-grace-ms: 5000
    outside-combat-repeat-threshold: 2
    protect-airborne: true
    min-protected-fall-distance: 3.0
    setbackvl: 0
    decay: 0.10

# Independent PvP ledger used by ConnectionStall. It does not require CombatPlus or another combat plugin.
combat-integrity:
    enabled: true
    tag-seconds: 15
    # Minimum tag restored after a stall. This stops a short freeze at the final milliseconds from becoming a free escape.
    # Set to 0 if you want to preserve exactly the time that was left.
    resume-minimum-tag-ms: 3000
    pending-disconnect-window-seconds: 300
    # false = only disconnects connected to a protected stall are handled here.
    # Your normal combat plugin can keep handling ordinary combat-logouts.
    punish-all-combat-quits: false
    kill-on-unsafe-disconnect: true
    kill-on-next-join-if-needed: true
    block-commands: true
    silent-protection: true
    block-message: ""
    allowed-commands:
      - "msg"
      - "tell"
      - "r"
    providers:
        fallback-internal: true
        combatplus:
            enabled: true
            refresh-during-protection-ms: 1000

VehicleTimer:
    # Țintă timer 1.005
    setbackvl: 10

PacketOrderI:
    # activează dacă jucătorii sunt marcați folosind moduri de animații 1.7
    exempt-placing-while-digging: false

Reach:
    # Cu cât să mărim hitboxurile? 0.0005 ar trebui să detecteze reach 3.0005+
    #
    # Există o extindere forțată de 0.03 cu clienți 1.9-1.18.1 (nu 1.18.2), sau unele combinații client/server datorită
    # schimbărilor și limitărilor protocolului. Acest check este cel mai puternic cu clienți 1.7/1.8 pe servere 1.8.
    threshold: 0.0005
    # Ar trebui să anulăm loviturile imposibile?
    # Lovituri de 3.00-3.03 pot trece dar tot vor fi marcate, din cauza limitărilor de ordine a pachetelor
    block-impossible-hits: true
    # Va trimite un pachet suplimentar la sfârșitul fiecărui tick pentru a crește șansele de a prinde cheat-uri
    # Injectează în lista de conexiuni a serverului pentru a trimite un pachet final chiar înainte ca serverul să facă flush
    # Activarea va crește traficul pentru toți jucătorii
    # Nu va scădea performanța serverului
    # Activarea va prinde mai mulți cheateri.
    # Lăsarea dezactivată va prinde totuși cheateri și nu va produce rezultate fals pozitive
    # Dacă nu ești server PvP 1.8, acest pachet suplimentar nu este recomandat
    enable-post-packet: false

exploit:
    # Poți obține viteze mari sărind în timp ce prinzi sprint cu elytra, aceasta previne exploitul dacă este setată pe false
    # Mojang a stricat netcode-ul făcând startul elytra client-side și finalul server-side
    # Elytra are fricțiune orizontală 0.99, așa că adăugând constant 0.2 viteză rezultă în viteze foarte mari.
    allow-sprint-jumping-when-using-elytra: true
    # Această opțiune reduce efectul ghostblocks prin resincronizarea jucătorului când se întâmplă
    allow-building-on-ghostblocks: false
    # Această setare, influențată de booleanul de mai sus, definește distanța verificată pentru ghostblocks
    # Interval valid: 2 până la 4
    distance-to-check-if-ghostblocks: 2

# Activează logarea pluginurilor care s-au injectat în netty la intrare pentru debugging de compatibilitate
debug-pipeline-on-join: false

# Activează verificări experimentale
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true

# Grim uneori anulează pachete ilegale precum timer, după X pachete anulate într-o secundă, când să
# deconectăm jucătorul? Este necesar deoarece unele limitatoare de pachete nu numără pachetele anulate de Grim.
packet-spam-threshold: 100
# Activează pentru a afișa stacktrace când un jucător e deconectat din cauza packet-spam-threshold
debug-packet-cancel: false

# Grim poate impune ca un jucător scos din starea de zbor să nu aibă mai mult de X ms ping
# Deoarece Grim nu verifică în prezent jucătorii care zboară
# Pentru dezactivare, folosește -1
max-ping-out-of-flying: 1000

# Ping maxim când boost-ul cu artificii este eliminat de la jucător.
# Împiedică jucătorii cu latență mare să folosească un boost cu artificii la infinit cu elytra.
max-ping-firework-boost: 1000

# Markeri de schemă — modifică-i doar dacă știi ce faci.
#   config-flavor:  V2 = build Grim 2.x, V3 = Grim 3.x. Plugin-ul refuză să
#                   încarce o configurație al cărei flavor nu se potrivește cu
#                   build-ul propriu — o config V3 deschisă de un jar V2
#                   eșuează imediat în loc să fuzioneze în tăcere în chei
#                   greșite.
#   config-version: incrementat la fiecare schimbare de formă incompatibilă.
#                   Configurațiile vechi sunt migrate automat de updater-ul
#                   inclus la următoarea pornire.
# Grim reîmprospătează întotdeauna permisiunile memorate în cache când un jucător
# intră și când Grim este reîncărcat, indiferent dacă LuckPerms este instalat.
# Hook-urile de evenimente LuckPerms reîmprospătează imediat și permisiunile Grim
# din cache în configurațiile obișnuite.
# Acest fallback periodic este necesar doar pentru schimbări online de permisiuni
# neacoperite de acele evenimente, cum ar fi un context LuckPerms personalizat care
# nu apelează signalContextUpdate, lipsuri de context pe Fabric sau un furnizor de
# permisiuni diferit de LuckPerms care schimbă permisiuni live.
# Setează -1 pentru a dezactiva interogarea periodică. Setează o valoare pozitivă pentru a reîmprospăta la fiecare X tick-uri.
update-permission-ticks: -1

config-flavor: V2
config-version: 22

# Staff-only diagnostic alert emitted only when Grim actually sends a movement
# correction/resync. It does not add VL and does not execute punishments.
# The normal Grim alert style is preserved; the verbose part tells you what the
# correction was related to, e.g. related=cobweb or related=normal,blink,packet_burst.
correction-diagnostics:
    enabled: true
    cooldown-ms: 125
    recent-check-window-ms: 750
    format: "%prefix% &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose% &8[p=%ping% tps=%tps% corr=%integrity_score%]"

# Preserves predicted fall debt across freeze/Blink stalls so packet silence cannot erase fall damage bookkeeping.
fall-integrity:
    enabled: true
    enforce-platform-fall-distance: true
    minimum-distance: 3.0
    maximum-enforced-distance: 256.0
    recovery-retention-ms: 8000
    disconnect-retention-ms: 60000

# Correlates independent evidence in short/long windows. It never punishes by score alone.
integrity-correlation:
    enabled: true
    short-window-ms: 2500
    long-window-ms: 15000
    decay-per-second: 0.18
    long-window-multiplier: 0.35
    retention-seconds: 30
    # Repeated Simulation flags from one continuous context are one evidence episode, not unlimited independent proof.
    simulation-episodes:
        enabled: true
        window-ms: 1200
        repeated-weight-multiplier: 0.15
        max-contribution: 1.0
    weights:
        simulation: 0.5
        selective-stall: 3.0
        airborne-stall: 2.0
        packet-burst: 1.0
        no-fall: 2.5
        phase: 3.0
        cancelled-block-support: 2.5
        unsafe-disconnect: 3.0
        queued-action: 2.5
        inventory-frequency: 1.0
        fast-consume: 2.5
        regen-packet: 2.5
        packet-order: 1.5
        multi-action: 1.5
        attack-burst: 2.0
        block-place-burst: 1.5

# Adds packet-rate/burst evidence on top of Grim Timer/NegativeTimer and ConnectionStall.
packet-integrity:
    enabled: true
    legacy-gap-ms: 250
    modern-gap-ms: 700
    recovery-window-ms: 500
    minimum-burst-packets: 5
    minimum-transaction-advance: 2
    selective-stall-causal-window-ms: 2000
    short-window-limit: 7.0
    one-second-limit: 25.0
    flag-buffer: 2.0
    flag-cooldown-ms: 1500

# Interaction integrity reuses CompensatedInventory, PacketOrder, MultiActions and NoSlow.
# v22 packet-driven Regen guard. Timer owns extra-tick cancellation; Regen adds dedicated VL.
regen-guard:
    enabled: true
    heal-correlation-window-ms: 1500
    packet-abuse-window-ms: 1200
    minimum-timer-ahead-ms: 35
    minimum-packets-250ms: 7
    minimum-heal-amount: 0.25
    minimum-confidence: 0.60
    flag-buffer: 2.0
    flag-cooldown-ms: 900
    prevent:
        enabled: true
        minimum-timer-ahead-ms: 80

Regen:
    setbackvl: -1
    decay: 0.15

interaction-integrity:
    enabled: true
    consume:
        enabled: true
        minimum-ratio: 0.72
        absolute-lenience-ms: 120
        stale-extra-ms: 3000
        flag-cooldown-ms: 1200
        require-item-match: true
        prevent:
            # Cancels the Bukkit consume event only when timing is impossible enough
            # and lag confidence is sufficient.
            enabled: true
            minimum-confidence: 0.60
    inventory-frequency:
        enabled: true
        short-limit: 7.0
        one-second-limit: 22.0
        four-second-limit: 60.0
        flag-buffer: 1.5
        flag-cooldown-ms: 1500
        # Normal fast inventory use is evidence first; protocol correlation or an extreme ratio is required to flag.
        require-protocol-correlation: true
        protocol-causal-window-ms: 1500
        standalone-extreme-ratio: 1.75

# Attack frequency only becomes strong Blink-combat evidence when paired with stall/burst state.
combat-frequency:
    enabled: true
    burst-attacks: 4
    burst-window-ms: 350
    causal-window-ms: 1500
    flag-cooldown-ms: 1200

# Central confidence reduction for heuristic evidence during server lag. Deterministic Grim checks remain active.
lag-protection:
    enabled: true
    minimum-tps: 17.0
    degraded-tps: 18.5
    tick-spike-ms: 250
    severe-tick-spike-ms: 1000
    degraded-confidence: 0.70
    severe-confidence: 0.30
    # Keep reduced heuristic confidence briefly after a real server spike; the queued packets arrive after the bad tick ended.
    spike-recovery-ms: 2500
    severe-spike-recovery-ms: 4000
    player-network:
        high-jitter-ms: 120.0
        severe-jitter-ms: 250.0
        high-ping-ms: 300.0
        severe-ping-ms: 600.0
        unstable-confidence: 0.75
        severe-confidence: 0.50
        retention-seconds: 120

# Reuse Grim's own block history before Phase flags immediately after a real world change.
# Phase 4A context layer. It only changes confidence for heuristic Simulation evidence; it never disables Phase/Reach/Timer.
environment-context:
    enabled: true
    recent-block-change-ticks: 4
    simulation-multipliers:
        cobweb: 0.35
        stuck-movement: 0.50
        climbable: 0.55
        liquid: 0.60
        complex-collision: 0.70
        piston: 0.55
        recent-block-change: 0.55
    enforcement-multipliers:
        # These affect only the extra advantage-prevention layer, not Grim's predictor.
        # 1.0 = normal aggressiveness, lower values = more tolerance in special physics.
        cobweb: 0.15
        stuck-movement: 0.35
        climbable: 0.45
        liquid: 0.55
        complex-collision: 0.65
        piston: 0.45
        recent-block-change: 0.50

    correction-min-raw-offsets:
        # Raw Simulation offset required before a special-physics correction can occur.
        cobweb: 0.30
        stuck-movement: 0.22
        climbable: 0.18
        liquid: 0.18
        complex-collision: 0.12
        piston: 0.20
        recent-block-change: 0.15
    correction-policy:
        # v22: context names, not material IDs. Routine force-resyncs are deferred
        # during special physics while Phase and strong Simulation remain active.
        suppress-routine-force-resync-contexts:
          - COBWEB
          - STUCK_MOVEMENT
          - CLIMBABLE

world-integrity:
    phase-recent-block-grace-ticks: 4

    phase-protection:
        enabled: true
        immediate-setback: true

        protected-materials:
          - BARRIER

        protected-tags:
          - DOORS
          - TRAPDOORS
          - FENCE_GATES

        legacy-1_8-exemptions:
            enabled: true
            materials:
              - CHEST
              - TRAPPED_CHEST
            tags:
              - ANVIL

        source-resolution:
            search-padding-blocks: 1
            match-epsilon: 0.0000001



movement-enforcement:
    enabled: true

    environment:
        # Prevent a special movement state from leaving the player trapped by a stale safe position.
        recovery-ticks: 3
        recovery-multiplier: 0.70
        # Short-Blink heuristics are disabled only while special movement physics/recovery is active.
        # Simulation, Phase, Timer and the normal Grim predictor remain active.
        disable-short-blink: true
        # v22: special physics needs persistent, clearly impossible raw movement before correction.
        correction-strong-ticks: 3

    # Prediction evidence that is strong enough to stop the current position
    # from replacing Grim's last known safe position.
    quarantine-offset: 0.020

    # Repeated strong evidence can setback even when one individual offset
    # is below the severe threshold.
    strong-offset: 0.050
    severe-offset: 0.100
    strong-consecutive-ticks: 2

    # A quarantined player must move cleanly for this many checked movements
    # before positions are promoted as safe again.
    clean-recovery-ticks: 3

    immediate-setback: true
    ground-spoof-quarantine: true

    # Short Blink mitigation is prevention-only. A short network gap does not
    # become a standalone cheat flag. It only freezes safe-position promotion
    # and rolls back a compressed movement release when packet/transaction
    # evidence and gained distance are strong enough.
    short-blink:
        # Fallback only. v20 ConnectionStall owns Blink rollback to avoid duplicate setbacks.
        enabled: false
        min-gap-ms: 120
        max-gap-ms: 1000
        recovery-window-ms: 600
        burst-interval-ms: 50
        minimum-release-packets: 2
        minimum-transaction-advance: 1
        minimum-distance: 0.12
        minimum-confidence: 0.45

# Tracks placements cancelled by protection plugins (WorldGuard, build deny, etc.) so they cannot become client-only movement support.
cancelled-block-integrity:
    enabled: true
    retention-ms: 2500
    max-entries-per-player: 32

ExploitCancelledBlock:
    flag-after: 3
    setbackvl: 0
    decay: 0.20

# Blocks queued attacks/places/breaks released after a confirmed selective packet stall.
StallActions:
    block-attacks: true
    block-places: true
    block-breaks: true
    block-use-items: true
    block-entity-interactions: true
    # Disabled by default to avoid inventory desync on heavily customized servers.
    block-inventory-clicks: false
    block-release-use-item: true
    flag-cooldown-ms: 750
    setbackvl: -1
    decay: 0.20

# Multiple distinct placements without an intervening client tick are not vanilla behavior.
MultiPlace:
    cancelVL: 2
