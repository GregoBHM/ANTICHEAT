# GrimAC ana konfigrasyon dosyası
# Kaynak kodu: https://github.com/MWHunter/Grim
# Telif Hakkı 2025 DefineOutside ve katkıda bulunanlar, GPLv3 altında lisanslanmıştır.
# Değiştirilmiş ikili dosyalar veya kopyalanmış grim kodlu eklentiler özel olmalıdır,
# veya ek ücret ödemeden alıcılara sunulan tam kaynak kodu ile.

alerts:
    # SparkGrim Phase 3 only aggregates normal staff alerts; internal flags, logs, history and /grim verbose stay complete.
    enabled: true
    aggregation: true
    burst-summary: true
    cooldown-ms: 1500
    minimum-vl-gap: 5
    state-retention-seconds: 600
    milestones:
        - "1"
        - "5"
        - "10"
        - "15"
        - "20"
    severity:
        medium: 4.0
        high: 8.0
        critical: 14.0
    # Oyunculara uyarı yayınlamanın yanı sıra, uyarılar konsola da gönderilmeli mi?
    print-to-console: true
    # Bu, uyarıların proxy'nize bağlı sunucular arasında paylaşılıp paylaşılmayacağını/nasıl paylaşılacağını kontrol eder.
    # Velocity kullanılıyorsa, Velocity yapılandırmanızda 'bungee-plugin-message-channel' etkinleştirilmiş olmalıdır.
    proxy:
        # Proxy'nize bağlı diğer sunuculara uyarılar gönderilmeli mi?
        send: false
        # Diğer sunuculardan alınan uyarılar bu sunucuya duyurulmalı mı?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Bu, giriş yapılan clientin aşağıdaki regex'lerle eşleşmesi durumunda markalarını operatörlere yayınlamayacağı anlamına gelir
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Seyirciler aktif olarak izliyor olsalar bile, grim.spectator iznine sahip tüm seyircileri gizle
    hide-regardless: false
    # Sadece bu dünyalarda seyircileri gizleyecek, tüm dünyalara izin vermek için boş bırakın
    allowed-worlds:
        - ""

# Oyuncuların zaman aşımından dolayı sunucudan atılmadan önce ne kadar süreleri olmalı? Varsayılan = 60 saniye
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Varsayılan blok yeniden senkronizasyon işleyicisi devre dışı bırakılsın mı?
# Varsayılan olarak Grim, blokları sunucu dünyasından okur ve senkronizasyon bozukluğunu düzeltmek için istemciye gönderir.
# Paket tabanlı sahte bloklar (sunucu dünyasında var olmayan) oluşturan eklentiler kullanıyorsanız,
# Grim'in bunları hava/gerçek bloklarla üzerine yazmasını önlemek için bunu true olarak ayarlamalısınız.
# Bu, API aracılığıyla özel bir tane sağlanmadıkça bir "NoOp" (İşlemsiz) işleyicisinin kullanılmasını zorlar.
disable-default-resync-handler: false

# Kopya hareket paketinin iptal edilip edilmemesi gerektiği
# Mojang bu sorunu 1.21'de çözdü. Bu, "kova senkronizasyonu" sorununu düzeltme girişimiydi. https://bugs.mojang.com/browse/MC-12363
# Bu ayar yalnızca 1.17-1.20.5 istemcileri için 1.8 sunucularında geçerlidir.
cancel-duplicate-packet: true

# Eşya çoğaltma paketlerindeki rotayı göz ardı edip etmeyeceğimiz
ignore-duplicate-packet-rotation: false

Simulation:
    # Oyuncu meşru olduğunda toplam avantajı ne kadar çarpmalıyız?
    # Varsayılan yapılandırma bu şekilde görünür (x ekseni = saniye, y ekseni = 1/1000 blok): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Oyuncunun hareketinden ne kadar büyük bir sapma ihlal oluşturmalıyız?
    # Mümkün olan hareketten blok cinsinden ölçülür
    # Optifine için trig tablolarını değiştirerek hesaba katıyoruz, ancak bunu 0.001'e düşürmek FastMath'ı azaltır
    # Bu telafi işe yaramazsa anticheat'i işaretle...
    threshold: 0.001
    # Bir tik içinde ne kadar büyük bir ihlal olmalı ki oyuncu hemen geri dönsün?
    # Devre dışı bırakmak için -1 yazın
    immediate-setback-threshold: 0.1
    # Tüm tikler boyunca ne kadar büyük bir avantaja sahip olmalıyız ki geri dönüş yapmaya başlayalım?
    # Devre dışı bırakmak için -1 yazın
    max-advantage: 1
    # Varsayılan config ile 50 saniye sonra, oyuncu 4 bloktan -> 1 bloğa kadar avantaj kazanır
    # Bu, oyuncunun çok fazla ihlal biriktirmesini ve bunların hepsini temizleyememesini önlemek içindir
    # Varsayılan avantaj tavanı (x ekseni = saniye, y ekseni = 1/1000 blok): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Geri alma için ihlal seviyesi eşiği
    # Eski davranış için 1
    setback-violation-threshold: 1

# Bir oyuncunun bir hareket sırasında bir bloğa girip girmediğini kontrol eder
Phase:
    setbackvl: 1 # Blokların içinde glitch yapmak duvara tırmanmaya izin verebilir, ayrıca bu kontrol nispeten stabildir
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Tahmin tabanlı yavaşlama kontrolü
# Grim burada hatalı ağ kodunu dikkate alır... sağ tıklama ve el yan tuşunu spam yapsanız bile yanlış pozitiflik oluşturması zordur
# Diğer anti-hilelerden çok daha stabil, ancak herhangi bir yanlış pozitif rapor edin... burada birçok ağ kodu sorununu çözdüm.
NoSlow:
    # Ne kadar bir sapma "hile" olarak kabul edilir?
    # Varsayılan olarak bu, diğer sapmalardan daha düşüktür
    # NoSlow açıkken 0.03-0.2 aralığında sürekli olarak uyarı verir
    threshold: 0.001
    # NoSlow'un sağladığı avantajı ortadan kaldırmak için ilk itemi hızlı bir şekilde geri alın
    setbackvl: 5
    # Oyuncu bir eşya kullandığında VE onun tarafından yavaşlatıldığında beklenilen zaman
    decay: 0.05

Knockback:
    # Oyuncu legit olduğunda toplam avantajı ne kadarla çarpmalıyız
    setback-decay-multiplier: 0.999
    # Oyuncunun hızından ne kadar büyük bir sapma ihlal oluşturmalıyız?
    # Mümkün olan hızdan blok cinsinden ölçülür
    threshold: 0.001
    # Bir tik içinde ne kadar büyük bir ihlal olmalı ki oyuncu hemen geri dönsün?
    # Devre dışı bırakmak için -1 yazın
    immediate-setback-threshold: 0.1
    # Tüm tikler boyunca ne kadar büyük bir avantaja sahip olmalıyız ki geri dönüş yapmaya başlayalım?
    # Devre dışı bırakmak için -1 yazın
    max-advantage: 1
    # Bu, oyuncunun çok fazla ihlal toplamasını ve asla hepsini temizleyememesini engellemek içindir
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Oyuncunun geri kaldığında biriktirebileceği milisaniye miktarı
    # Çok yüksek ayarlandığında 1.8 hızlı kullanma/hızlı iyileşme/hızlı yay atlama durumlarına izin verebilir, 120 ms iyi bir denge gibi görünüyor
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Kontrolün zamanlayıcı dengesini sınırlamaya başlayacağı ping değeri, kötüye kullanımı önlemek için.
    # Bu, yalnızca bu ping eşiğini aşan meşru oyuncular için bazı geri dönüşlere neden olabilir.
    # Devre dışı bırakmak için -1 yazın
    ping-abuse-limit-threshold: 1000

    hard-prevention:
        # TimerA already cancels pure Timer abuse. This layer may cancel movement
        # when Blink/PacketBurst evidence exists, but Blink rollback is owned only
        # by ConnectionStall's one-shot hard-release barrier.
        enabled: true
        cancel-movement: true
        minimum-confidence: 0.55
        causal-window-ms: 1500
NegativeTimer:
    # Uyarı vermeye başlamadan önce hareket halindeyken kaybedilen milisaniye sayısı
    drift: 1200

    # TimerA ile aynı kontrol yöntemi, ancak araçlar için
# Protects movement integrity when a client stops sending movement packets while the connection remains alive.
# This also powers combat-tag preservation during suspicious/ambiguous stalls.
integrity-profile: balanced

# Phase 4B Blink mitigation. Full connection freezes remain ambiguous; selective stalls require transaction progress.
blink-mitigation:
    enabled: true
    profile: balanced
    hard-release:
        # v20: a single movement gap NEVER causes a rollback by itself.
        # The first packet only arms a candidate; a second movement packet must arrive
        # inside burst-confirm-max-interval-ms to prove a compressed Blink release.
        enabled: true
        legacy-min-gap-ms: 120
        modern-min-gap-ms: 700
        max-gap-ms: 1600
        min-transaction-advance: 1
        minimum-confidence: 0.80
        burst-confirm-max-interval-ms: 35
        # Only the buffered tail is discarded. Accepted movement resumes immediately
        # after this short window; no repeated setback is allowed during recovery.
        cancel-window-ms: 180
        recovery-no-setback-ms: 600
        setback: true
        # A single confirmed release is prevention first. Repeated confirmed releases
        # become ConnectionStall evidence and can be sanctioned through punishments.yml.
        flag-after-repeats: 3
        repeat-window-ms: 8000
        flag-cooldown-ms: 3000
    recovery:
        max-ms: 8000
        min-movement-packets: 8
        min-transaction-advance: 2
    profiles:
        safe:
            legacy-watch-gap-ms: 450
            modern-watch-gap-ms: 1500
            airborne-watch-gap-ms: 650
            confirm-gap-ms: 1200
            min-transaction-advance: 5
            release-guard-min-gap-ms: 1400
            release-guard-min-transactions: 5
            release-guard-repeat-threshold: 3
            protect-full-freeze-airborne: false
        balanced:
            legacy-watch-gap-ms: 350
            modern-watch-gap-ms: 1200
            airborne-watch-gap-ms: 500
            confirm-gap-ms: 900
            min-transaction-advance: 3
            release-guard-min-gap-ms: 1000
            release-guard-min-transactions: 3
            release-guard-repeat-threshold: 2
            protect-full-freeze-airborne: false
        lockdown:
            legacy-watch-gap-ms: 300
            modern-watch-gap-ms: 900
            airborne-watch-gap-ms: 400
            confirm-gap-ms: 700
            min-transaction-advance: 2
            release-guard-min-gap-ms: 750
            release-guard-min-transactions: 2
            release-guard-repeat-threshold: 1
            protect-full-freeze-airborne: false

# Uses Grim's existing safe setback position once, only when a selective Blink release has enough evidence.
movement-release-guard:
    enabled: true
    cooldown-ms: 500
    retention-seconds: 120

movement-context-auto:
    enabled: true
    velocity-duration-ms: 900
    teleport-duration-ms: 1200
    cancelled-move-duration-ms: 300
    flight-duration-ms: 3000

ConnectionStall:
    enabled: true
    # Legacy 1.8 clients normally send a flying packet every tick, even while standing still.
    legacy-watch-gap-ms: 350
    # Modern clients may legally skip more movement packets while idle.
    modern-watch-gap-ms: 1200
    # Airborne gaps are more dangerous because they can suspend falling.
    airborne-watch-gap-ms: 500
    # A stall only becomes a cheat signal after this gap AND enough transaction replies continue.
    confirm-gap-ms: 900
    # Preserve historical combat on quit even if the final stall is shorter than the normal watch threshold.
    disconnect-protect-gap-ms: 150
    # Freeze combat time even for short sub-threshold stalls; this is protection only, not a cheat flag.
    combat-hold-gap-ms: 150
    modern-combat-hold-gap-ms: 500
    min-transaction-advance: 3
    # Full connection freezes can look legitimate, so this mitigates long airborne stalls without flagging them.
    ambiguous-airborne-setback-ms: 1500
    # Movement must remain clean this long before a protected combat tag resumes counting down.
    recovery-clean-ms: 2000
    flag-cooldown-ms: 3000
    join-grace-ms: 5000
    outside-combat-repeat-threshold: 2
    protect-airborne: true
    min-protected-fall-distance: 3.0
    setbackvl: 0
    decay: 0.10

# Independent PvP ledger used by ConnectionStall. It does not require CombatPlus or another combat plugin.
combat-integrity:
    enabled: true
    tag-seconds: 15
    # Minimum tag restored after a stall. This stops a short freeze at the final milliseconds from becoming a free escape.
    # Set to 0 if you want to preserve exactly the time that was left.
    resume-minimum-tag-ms: 3000
    pending-disconnect-window-seconds: 300
    # false = only disconnects connected to a protected stall are handled here.
    # Your normal combat plugin can keep handling ordinary combat-logouts.
    punish-all-combat-quits: false
    kill-on-unsafe-disconnect: true
    kill-on-next-join-if-needed: true
    block-commands: true
    silent-protection: true
    block-message: ""
    allowed-commands:
      - "msg"
      - "tell"
      - "r"
    providers:
        fallback-internal: true
        combatplus:
            enabled: true
            refresh-during-protection-ms: 1000

VehicleTimer:
    # Hedef 1.005 timer
    setbackvl: 10

PacketOrderI:
    # Oyuncular 1.7 animasyon modlarını kullandıkları için işaretleniyorsa etkinleştirin
    exempt-placing-while-digging: false

Reach:
    # Hitbox'ları ne kadar genişletmeliyiz? 0.0005, 3.0005+ menzili tespit etmelidir
    #
    # 1.9-1.18.1 (1.18.2 değil) ile zorunlu olarak 0.03 genişletme vardır veya bazı istemci/sunucu kombinasyonları nedeniyle
    # protokol değişiklikleri ve sınırlamaları nedeniyle. Bu kontrol, 1.7/1.8 istemcilerle 1.8 sunucularda en güçlüdür.
    threshold: 0.0005
    # İmkansız olduğunu bildiğimiz vuruşları iptal etmeli miyiz?
    # Paket sırası sınırlamaları nedeniyle 3.00-3.03 arası vuruşlar gerçekleşebilir, ancak yine de işaretlenebilir
    block-impossible-hits: true
    # Bu, hileleri yakalama olasılığını artırmak için her tikin sonunda ek bir paket gönderecektir
    # Bu, sunucunun bağlantı listesine enjekte edilerek sunucu boşaltmadan hemen önce son bir paket göndermek için yapılır
    # Bunu etkinleştirmek, tüm oyuncular için bant genişliği kullanımını artıracaktır
    # Bu, genel sunucu performansını düşürmez
    # Bunu etkinleştirmek, daha fazla hilecinin yakalanmasını sağlar
    # Bu özellik devre dışı bırakılsa bile hileciler yakalanır ve yanlış pozitifler oluşmaz
    # 1.8 PvP odaklı bir sunucu değilseniz, bu ek paket önerilmez
    enable-post-packet: false

exploit:
    # Elytra ile sprint zıplarken yüksek hızlar kazanabilirsiniz, bu ayar false olarak ayarlandığında bu istismarı önler
    # Mojang, elytra'nın istemci tarafında başlamasını ve sunucu tarafında bitmesini sağlayarak netcode'u bozdu
    # Elytra'lar 0.99 yatay sürtünme alır, bu yüzden sürekli olarak 0.2 yatay hız eklemek çok yüksek hızlara yol açar
    allow-sprint-jumping-when-using-elytra: true
    # Bu seçenek, oyuncunun hayalet bloklar üzerindeki yerleşimini, gerçekleştiğinde oyuncuyu yeniden senkronize ederek hafifletir
    allow-building-on-ghostblocks: false
    # Bu ayar, yukarıdaki boolean ile etkilenen hayalet blokları kontrol etmek için mesafeyi tanımlar
    # Geçerli aralığı 2 ile 4 arasında sınırlıdır
    distance-to-check-if-ghostblocks: 2

# Netty'ye enjekte olan eklentileri giriş sırasında günlüklemeyi etkinleştirerek uyumluluk sorunlarını gider
debug-pipeline-on-join: false

# Deneysel kontrolleri etkinleştir
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Grim bazen timer gibi yasa dışı paketleri iptal eder; bir saniyede X paket iptal edildikten sonra, ne zaman
# oyuncuyu basitçe atmalıyız? Bu, bazı paket sınırlayıcılarının Grim tarafından iptal edilen paketleri saymaması gerektiğindendir.
packet-spam-threshold: 100
# Bir oyuncu packet-spam-threshold nedeniyle atıldığında stacktrace yazdırmak için bunu etkinleştirin
debug-packet-cancel: false

# Grim, uçma durumundan çıkmış bir oyuncunun X milisaniyeden fazla ping'e sahip olamayacağını uygulayabilir
# Bu, Grim'in şu anda uçan oyuncuları kontrol etmemesindendir
# Devre dışı bırakmak için -1 yazın
max-ping-out-of-flying: 1000

# Bir havai fişek ivmesi oyuncudan çıkarıldığında maksimum ping.
# Bu, yüksek gecikmeli oyuncuların bir havai fişek ivmesini elytra ile sonsuza kadar kullanmalarını engeller.
max-ping-firework-boost: 1000

# Şema işaretçileri — yalnızca ne yaptığınızı biliyorsanız değiştirin.
#   config-flavor:  V2 = Grim 2.x derlemesi, V3 = Grim 3.x. Eklenti, flavor'ı
#                   kendi derlemesiyle uyuşmayan bir config'i yüklemeyi
#                   reddeder; V3 config'i V2 jar ile açılırsa, yanlış
#                   anahtarlara sessizce karışmak yerine hemen başarısız olur.
#   config-version: her geriye dönük uyumsuz biçim değişikliğinde artırılır.
#                   Eski config'ler bir sonraki başlatmada, pakete dahil
#                   updater tarafından otomatik taşınır.
# LuckPerms kurulu olsun ya da olmasın, bir oyuncu katıldığında ve Grim yeniden
# yüklendiğinde Grim önbellekteki izinleri her zaman yeniler.
# LuckPerms olay hook'ları normal kurulumlarda önbellekteki Grim izinlerini de
# anında yeniler.
# Bu periyodik yedek yalnızca bu olayların kapsamadığı çevrim içi izin
# değişiklikleri için gereklidir; örneğin signalContextUpdate çağırmayan özel bir
# LuckPerms context'i, Fabric context boşlukları veya LuckPerms dışında izinleri
# canlı olarak değiştiren bir izin sağlayıcısı.
# Yoklamayı devre dışı bırakmak için -1 kullanın. Her X tick'te yenilemek için pozitif bir değer kullanın.
update-permission-ticks: -1

config-flavor: V2
config-version: 21

# Staff-only diagnostic alert emitted only when Grim actually sends a movement
# correction/resync. It does not add VL and does not execute punishments.
# The normal Grim alert style is preserved; the verbose part tells you what the
# correction was related to, e.g. related=cobweb or related=normal,blink,packet_burst.
correction-diagnostics:
    enabled: true
    cooldown-ms: 125
    recent-check-window-ms: 750
    format: "%prefix% &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose% &8[p=%ping% tps=%tps% corr=%integrity_score%]"

# Preserves predicted fall debt across freeze/Blink stalls so packet silence cannot erase fall damage bookkeeping.
fall-integrity:
    enabled: true
    enforce-platform-fall-distance: true
    minimum-distance: 3.0
    maximum-enforced-distance: 256.0
    recovery-retention-ms: 8000
    disconnect-retention-ms: 60000

# Correlates independent evidence in short/long windows. It never punishes by score alone.
integrity-correlation:
    enabled: true
    short-window-ms: 2500
    long-window-ms: 15000
    decay-per-second: 0.18
    long-window-multiplier: 0.35
    retention-seconds: 30
    # Repeated Simulation flags from one continuous context are one evidence episode, not unlimited independent proof.
    simulation-episodes:
        enabled: true
        window-ms: 1200
        repeated-weight-multiplier: 0.15
        max-contribution: 1.0
    weights:
        simulation: 0.5
        selective-stall: 3.0
        airborne-stall: 2.0
        packet-burst: 1.0
        no-fall: 2.5
        phase: 3.0
        cancelled-block-support: 2.5
        unsafe-disconnect: 3.0
        queued-action: 2.5
        inventory-frequency: 1.0
        fast-consume: 2.5
        packet-order: 1.5
        multi-action: 1.5
        attack-burst: 2.0
        block-place-burst: 1.5

# Adds packet-rate/burst evidence on top of Grim Timer/NegativeTimer and ConnectionStall.
packet-integrity:
    enabled: true
    legacy-gap-ms: 250
    modern-gap-ms: 700
    recovery-window-ms: 500
    minimum-burst-packets: 5
    minimum-transaction-advance: 2
    selective-stall-causal-window-ms: 2000
    short-window-limit: 7.0
    one-second-limit: 25.0
    flag-buffer: 2.0
    flag-cooldown-ms: 1500

# Interaction integrity reuses CompensatedInventory, PacketOrder, MultiActions and NoSlow.
interaction-integrity:
    enabled: true
    consume:
        enabled: true
        minimum-ratio: 0.72
        absolute-lenience-ms: 120
        stale-extra-ms: 3000
        flag-cooldown-ms: 1200
        require-item-match: true
        prevent:
            # Cancels the Bukkit consume event only when timing is impossible enough
            # and lag confidence is sufficient.
            enabled: true
            minimum-confidence: 0.60
    inventory-frequency:
        enabled: true
        short-limit: 7.0
        one-second-limit: 22.0
        four-second-limit: 60.0
        flag-buffer: 1.5
        flag-cooldown-ms: 1500
        # Normal fast inventory use is evidence first; protocol correlation or an extreme ratio is required to flag.
        require-protocol-correlation: true
        protocol-causal-window-ms: 1500
        standalone-extreme-ratio: 1.75

# Attack frequency only becomes strong Blink-combat evidence when paired with stall/burst state.
combat-frequency:
    enabled: true
    burst-attacks: 4
    burst-window-ms: 350
    causal-window-ms: 1500
    flag-cooldown-ms: 1200

# Central confidence reduction for heuristic evidence during server lag. Deterministic Grim checks remain active.
lag-protection:
    enabled: true
    minimum-tps: 17.0
    degraded-tps: 18.5
    tick-spike-ms: 250
    severe-tick-spike-ms: 1000
    degraded-confidence: 0.70
    severe-confidence: 0.30
    # Keep reduced heuristic confidence briefly after a real server spike; the queued packets arrive after the bad tick ended.
    spike-recovery-ms: 2500
    severe-spike-recovery-ms: 4000
    player-network:
        high-jitter-ms: 120.0
        severe-jitter-ms: 250.0
        high-ping-ms: 300.0
        severe-ping-ms: 600.0
        unstable-confidence: 0.75
        severe-confidence: 0.50
        retention-seconds: 120

# Reuse Grim's own block history before Phase flags immediately after a real world change.
# Phase 4A context layer. It only changes confidence for heuristic Simulation evidence; it never disables Phase/Reach/Timer.
environment-context:
    enabled: true
    recent-block-change-ticks: 4
    simulation-multipliers:
        cobweb: 0.35
        stuck-movement: 0.50
        climbable: 0.55
        liquid: 0.60
        complex-collision: 0.70
        piston: 0.55
        recent-block-change: 0.55
    enforcement-multipliers:
        # These affect only the extra advantage-prevention layer, not Grim's predictor.
        # 1.0 = normal aggressiveness, lower values = more tolerance in special physics.
        cobweb: 0.15
        stuck-movement: 0.35
        climbable: 0.45
        liquid: 0.55
        complex-collision: 0.65
        piston: 0.45
        recent-block-change: 0.50

world-integrity:
    phase-recent-block-grace-ticks: 4

    phase-protection:
        enabled: true
        immediate-setback: true

        protected-materials:
          - BARRIER

        protected-tags:
          - DOORS
          - TRAPDOORS
          - FENCE_GATES

        legacy-1_8-exemptions:
            enabled: true
            materials:
              - CHEST
              - TRAPPED_CHEST
            tags:
              - ANVIL

        source-resolution:
            search-padding-blocks: 1
            match-epsilon: 0.0000001



movement-enforcement:
    enabled: true

    environment:
        # Prevent a special movement state from leaving the player trapped by a stale safe position.
        recovery-ticks: 3
        recovery-multiplier: 0.70
        # Short-Blink heuristics are disabled only while special movement physics/recovery is active.
        # Simulation, Phase, Timer and the normal Grim predictor remain active.
        disable-short-blink: true

    # Prediction evidence that is strong enough to stop the current position
    # from replacing Grim's last known safe position.
    quarantine-offset: 0.020

    # Repeated strong evidence can setback even when one individual offset
    # is below the severe threshold.
    strong-offset: 0.050
    severe-offset: 0.100
    strong-consecutive-ticks: 2

    # A quarantined player must move cleanly for this many checked movements
    # before positions are promoted as safe again.
    clean-recovery-ticks: 3

    immediate-setback: true
    ground-spoof-quarantine: true

    # Short Blink mitigation is prevention-only. A short network gap does not
    # become a standalone cheat flag. It only freezes safe-position promotion
    # and rolls back a compressed movement release when packet/transaction
    # evidence and gained distance are strong enough.
    short-blink:
        # Fallback only. v20 ConnectionStall owns Blink rollback to avoid duplicate setbacks.
        enabled: false
        min-gap-ms: 120
        max-gap-ms: 1000
        recovery-window-ms: 600
        burst-interval-ms: 50
        minimum-release-packets: 2
        minimum-transaction-advance: 1
        minimum-distance: 0.12
        minimum-confidence: 0.45

# Tracks placements cancelled by protection plugins (WorldGuard, build deny, etc.) so they cannot become client-only movement support.
cancelled-block-integrity:
    enabled: true
    retention-ms: 2500
    max-entries-per-player: 32

ExploitCancelledBlock:
    flag-after: 3
    setbackvl: 0
    decay: 0.20

# Blocks queued attacks/places/breaks released after a confirmed selective packet stall.
StallActions:
    block-attacks: true
    block-places: true
    block-breaks: true
    block-use-items: true
    block-entity-interactions: true
    # Disabled by default to avoid inventory desync on heavily customized servers.
    block-inventory-clicks: false
    block-release-use-item: true
    flag-cooldown-ms: 750
    setbackvl: -1
    decay: 0.20

# Multiple distinct placements without an intervening client tick are not vanilla behavior.
MultiPlace:
    cancelVL: 2
