# La configuración principal de GrimAC
# Código fuente: https://github.com/MWHunter/Grim
# Copyright 2025 DefineOutside y contribuyentes, licenciado bajo GPLv3.
# Binarios modificados o plugins con código de Grim deben ser privados o con
# el código fuente disponible para todos los compradores sin costo adicional.

alerts:
    # La Fase 3 solo agrupa las alertas normales del staff; flags internos, logs, historial y /grim verbose siguen completos.
    enabled: true
    aggregation: true
    burst-summary: true
    cooldown-ms: 1500
    minimum-vl-gap: 5
    state-retention-seconds: 600
    milestones:
        - "1"
        - "5"
        - "10"
        - "15"
        - "20"
    severity:
        medium: 4.0
        high: 8.0
        critical: 14.0
    # ¿Además de mandar las alertas a los jugadores, deberíamos mandarlas también a la consola?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: false
        # Should the alerts received from other servers be announced to this server?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Esto quiere decir que no se va a anunciar la marca del cliente si esta cumple alguno de los siguientes regexes:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Ocultar todos los espectadores con el permiso grim.spectator sin importar si realmente están espectando
    hide-regardless: false
    # ¿En qué mundos deberíamos ocultar los espectadores? Si está en blanco, se ocultaran en todos los mundos.
    allowed-worlds:
        - ""

# ¿Cuánto tiempo de espera debería pasar antes de expulsar un jugador por "tiempo de espera agotado"?
# Por defecto, este valor se encuentra en 60 segundos.
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# ¿Debería desactivarse el manejador de resincronización de bloques predeterminado?
# Por defecto, Grim lee los bloques del mundo del servidor y los envía al cliente para corregir la desincronización.
# Si utilizas plugins que crean bloques falsos basados en paquetes (que no existen en el mundo del servidor),
# deberías establecer esto en true para evitar que Grim los sobrescriba con aire o bloques reales.
# Esto fuerza el uso de un manejador "NoOp" (Sin Operación) a menos que se proporcione uno personalizado vía API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    # Asi es como se ve la configuración por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    # Tomamos en cuenta a OptiFine cambiando las tablas trigonometricas, pero bajar esto a 0.001 reducirá
    # que FastMath marque el anti-cheat si esta compensación no funciona...
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Después de 50 segundos con la configuración predeterminada, el jugador ira de 4 bloques -> 1 bloque de ventaja
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    # Tope de ventaja por defecto (eje x = segundos, eje y = bloque 1/1000): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Umbral del nivel de violación para el retroceso
    # 1 para el comportamiento antiguo
    setback-violation-threshold: 1

# Comprobaciones para ver si un jugador entro a un bloque durante un movimiento
Phase:
    setbackvl: 1 # Entrar a un bloque mediante bugs puede permitir subir paredes, además esta comprobación es relativamente estable.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Comprobación de NoSlow basado en predicciones
# Grim compensa por código de red con errores aquí... difícil de sacar un falso positivo incluso haciendo spam del
# clic derecho y la mano secundaria.
# Mucho mas estable que otros anti-cheats, pero por favor reportar todo falso positivo... he arreglado muchos
# problemas del código de red aquí.
NoSlow:
    # ¿Cuánta debería ser la compensacion como para que se considere trampa?
    # Por defecto esto es más bajo que otras compensaciones
    # Marca por 0.03-0.2 consistentemente con NoSlow activado
    threshold: 0.001
    # Retroceder rápidamente en el primer item para eliminar toda ventaja que NoSlow brinde
    setbackvl: 5
    # Decadencia cuando un jugador usa un item Y se ralentiza por el
    decay: 0.05

Knockback:
    # Por cuanto deberíamos multiplicar la ventaja total cuando el jugador es legítimo
    setback-decay-multiplier: 0.999
    # ¿Cuánta debería ser la compensacion del movimiento del jugador como para que creemos una violación?
    # Medido en bloques del posible movimiento
    threshold: 0.001
    # ¿Qué tan grande debería ser una violación en un tick antes de que el jugador se retroceda inmediatamente?
    # -1 para deshabilitar
    immediate-setback-threshold: 0.1
    # ¿Qué tan grande debería ser una ventaja sobre todos los ticks para que empecemos a retroceder?
    # -1 para deshabilitar
    max-advantage: 1
    # Esto es para prevenir que el jugador obtenga muchas violaciones y no pueda ser capaz de borrarlas
    max-ceiling: 4


    # v22: AntiKB owns velocity mitigation instead of teleporting the player.
    enforcement:
        enabled: true
        cooldown-ms: 120
        recovery-ms: 350
        episode-reset-ms: 1200
        max-retries: 2
        minimum-reapply-scale: 0.35
        suppress-in-special-environments: true

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milisegundos que el jugador puede acumular para ser usados mas tarde cuando se quedan por detrás
    # Podría llegar a permitir pasos por alto de fast use/fast heal/fast bow en 1.8 si esta muy alto, 120 ms
    # parece ser un balance bastante decente.
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

    hard-prevention:
        # TimerA already cancels pure Timer abuse. This layer may cancel movement
        # when Blink/PacketBurst evidence exists, but Blink rollback is owned only
        # by ConnectionStall's one-shot hard-release barrier.
        enabled: true
        cancel-movement: true
        minimum-confidence: 0.55
        causal-window-ms: 1500
NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 1200

# La misma comprobación que TimerA, pero para vehiculos
# Protects movement integrity when a client stops sending movement packets while the connection remains alive.
# This also powers combat-tag preservation during suspicious/ambiguous stalls.
# Perfil para la capa adicional de integridad de SparkGrim.
# safe = mas tolerante con conexiones inestables, balanced = recomendado, strict = mas rapido/agresivo.
integrity-profile: balanced

# Phase 4B Blink mitigation. Full connection freezes remain ambiguous; selective stalls require transaction progress.
blink-mitigation:
    enabled: true
    profile: balanced
    hard-release:
        # v20: a single movement gap NEVER causes a rollback by itself.
        # The first packet only arms a candidate; a second movement packet must arrive
        # inside burst-confirm-max-interval-ms to prove a compressed Blink release.
        enabled: true
        legacy-min-gap-ms: 80
        modern-min-gap-ms: 700
        # Threshold used only to label LONG_SELECTIVE releases. It is NOT an
        # upper limit anymore; long selective stalls remain preventable.
        long-selective-threshold-ms: 1600
        min-transaction-advance: 1
        # Player ping/jitter confidence gates sanction/VL, not prevention.
        sanction-minimum-confidence: 0.80
        # Prevention is disabled only when the SERVER itself is unhealthy.
        prevention-minimum-server-confidence: 0.55
        burst-confirm-max-interval-ms: 100
        # Only the buffered tail is discarded. Accepted movement resumes immediately
        # after this short window; no repeated setback is allowed during recovery.
        cancel-window-ms: 180
        recovery-no-setback-ms: 600
        setback: true
        # A single confirmed release is prevention first. Repeated confirmed releases
        # become ConnectionStall evidence and can be sanctioned through punishments.yml.
        flag-after-repeats: 3
        repeat-window-ms: 8000
        flag-cooldown-ms: 3000
    short-selective-action-guard:
        # Legacy close-range Blink guard: only selective transaction progress plus
        # a missing movement stream can block an action. A plain gap/high ping does not.
        enabled: true
        # Modern clients can legally skip movement packets while idle. Keep
        # action-first blocking off there until explicitly validated for production.
        modern-enabled: false
        legacy-min-gap-ms: 80
        modern-min-gap-ms: 700
        min-transaction-advance: 1
        minimum-server-confidence: 0.55
    # Ambiguous full freezes are prevention-only: protect the safe position and
    # queued actions briefly after release, but do not add VL by themselves.
    full-freeze-protection:
        enabled: true
        min-gap-ms: 1500
        release-protect-ms: 350
    recovery:
        max-ms: 8000
        min-movement-packets: 8
        min-transaction-advance: 2
    profiles:
        safe:
            legacy-watch-gap-ms: 450
            modern-watch-gap-ms: 1500
            airborne-watch-gap-ms: 650
            confirm-gap-ms: 1200
            min-transaction-advance: 5
            release-guard-min-gap-ms: 1400
            release-guard-min-transactions: 5
            release-guard-repeat-threshold: 3
            protect-full-freeze-airborne: false
        balanced:
            legacy-watch-gap-ms: 350
            modern-watch-gap-ms: 1200
            airborne-watch-gap-ms: 500
            confirm-gap-ms: 900
            min-transaction-advance: 3
            release-guard-min-gap-ms: 1000
            release-guard-min-transactions: 3
            release-guard-repeat-threshold: 2
            protect-full-freeze-airborne: false
        lockdown:
            legacy-watch-gap-ms: 300
            modern-watch-gap-ms: 900
            airborne-watch-gap-ms: 400
            confirm-gap-ms: 700
            min-transaction-advance: 2
            release-guard-min-gap-ms: 750
            release-guard-min-transactions: 2
            release-guard-repeat-threshold: 1
            protect-full-freeze-airborne: false

# Uses Grim's existing safe setback position once, only when a selective Blink release has enough evidence.
movement-release-guard:
    enabled: true
    cooldown-ms: 500
    retention-seconds: 120

# Contextos automaticos para movimientos provocados por el servidor.
# Esto cubre gran parte de MagicSpells/RPGItems sin dar bypass global al jugador.
movement-context-auto:
    enabled: true
    velocity-duration-ms: 900
    teleport-duration-ms: 1200
    cancelled-move-duration-ms: 300
    flight-duration-ms: 3000

ConnectionStall:
    enabled: true
    # Legacy 1.8 clients normally send a flying packet every tick, even while standing still.
    legacy-watch-gap-ms: 350
    # Modern clients may legally skip more movement packets while idle.
    modern-watch-gap-ms: 1200
    # Airborne gaps are more dangerous because they can suspend falling.
    airborne-watch-gap-ms: 500
    # A stall only becomes a cheat signal after this gap AND enough transaction replies continue.
    confirm-gap-ms: 900
    # Preserve historical combat on quit even if the final stall is shorter than the normal watch threshold.
    disconnect-protect-gap-ms: 150
    # Freeze combat time even for short sub-threshold stalls; this is protection only, not a cheat flag.
    combat-hold-gap-ms: 150
    modern-combat-hold-gap-ms: 500
    min-transaction-advance: 3
    # Full connection freezes can look legitimate, so this mitigates long airborne stalls without flagging them.
    ambiguous-airborne-setback-ms: 1500
    # Movement must remain clean this long before a protected combat tag resumes counting down.
    recovery-clean-ms: 2000
    flag-cooldown-ms: 3000
    join-grace-ms: 5000
    outside-combat-repeat-threshold: 2
    protect-airborne: true
    min-protected-fall-distance: 3.0
    setbackvl: 0
    decay: 0.10

# Independent PvP ledger used by ConnectionStall. It does not require CombatPlus or another combat plugin.
combat-integrity:
    enabled: true
    tag-seconds: 15
    # Minimum tag restored after a stall. This stops a short freeze at the final milliseconds from becoming a free escape.
    # Set to 0 if you want to preserve exactly the time that was left.
    resume-minimum-tag-ms: 3000
    pending-disconnect-window-seconds: 300
    # false = only disconnects connected to a protected stall are handled here.
    # Your normal combat plugin can keep handling ordinary combat-logouts.
    punish-all-combat-quits: false
    kill-on-unsafe-disconnect: true
    kill-on-next-join-if-needed: true
    block-commands: true
    silent-protection: true
    block-message: ""
    allowed-commands:
      - "msg"
      - "tell"
      - "r"
    providers:
        fallback-internal: true
        combatplus:
            enabled: true
            refresh-during-protection-ms: 1000

VehicleTimer:
    # Target 1.005 timer
    setbackvl: 10

PacketOrderI:
    # Habilitar si los jugadores están siendo marcados por usar mods de animación de la 1.7
    exempt-placing-while-digging: false

Reach:
    # Cuanto deberíamos expandir las hit-boxes? 0.0005 debería detectar un reach de 3.0005+
    #
    # Hay una expansion forzada de 0.03 con 1.9-1.18.1 (1.18.2 no) y algunas combinaciones de clientes/servidores
    # debido a cambios en el protocolo y limitaciones. Esta comprobación es más poderosa en clientes 1.7 y 1.8
    # conectados a un servidor 1.8
    threshold: 0.0005
    # ¿Deberíamos cancelar golpes que sabemos que son imposibles?
    # Golpes de 3.00-3.03 puede que aun asi pasen, pero se marcaran debido a limitaciones del orden de paquetes.
    block-impossible-hits: true
    # Esto mandará un paquete adicional al final de cada tick para aumentar las chances de encontrar trampas
    # Esto se inyecta en la lista de conexiones del servidor para mandar un paquete final justo antes de que el servidor haga "flush".
    # Habilitar esto causará que el uso de banda ancha de todos los jugadores aumente
    # Esto no disminuirá el rendimiento del servidor.
    # Habilitar esto ayudará a encontrar más jugadores haciendo trampa.
    # Dejar esto deshabilitado también encontrara a jugadores haciendo trampa y no causara falsos positivos.
    # Excepto que seas un servidor 1.8 enfocado en el PvP, este paquete adicional no es recomendado.
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Esta opción mitiga la colocación del jugador en bloques fantasma resincronizando al jugador cuando ocurre.
    allow-building-on-ghostblocks: false
    distance-to-check-if-ghostblocks: 2

# Habilitar el registro de plugins que se han inyectado a netty para intentar resolver problemas de compatibilidad.
debug-pipeline-on-join: false

# Habilitar comprobaciones experimentales
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Grim a veces cancela paquetes ilegal como los de Timer. Después de X paquetes en un solo segundo cancelados,
# cuando deberíamos simplemente expulsar al jugador? Esto es obligatorio ya que algunos limitadores de paquetes
# no cuentan los paquetes cancelados por Grim.
packet-spam-threshold: 100
# Activa esto para imprimir un stacktrace cuando un jugador sea expulsado por packet-spam-threshold
debug-packet-cancel: false

# Grim puede hacer cumplir que un jugador que ha salido del estado de vuelo no tenga más de X ms de ping
# Esto se debe a que Grim actualmente no comprueba a los jugadores que están volando
# Para desactivar, usa -1
max-ping-out-of-flying: 1000

# Ping máximo cuando se elimina el impulso de fuegos artificiales del jugador.
# Esto evita que los jugadores con alta latencia puedan usar un solo impulso con fuegos artificiales y una elytra para siempre.
max-ping-firework-boost: 1000

# Marcadores de esquema — toca solo si sabes lo que haces.
#   config-flavor:  V2 = build de Grim 2.x, V3 = Grim 3.x. El plugin se niega
#                   a cargar una config cuyo flavor no coincida con su propio
#                   build; una config V3 abierta por un jar V2 falla rápido en
#                   vez de fusionarse silenciosamente en claves equivocadas.
#   config-version: se incrementa con cada cambio de forma incompatible. Las
#                   configs antiguas se migran automáticamente con el updater
#                   incluido al siguiente arranque.
# Grim siempre actualiza los permisos en caché cuando un jugador entra y cuando
# Grim se recarga, tenga o no LuckPerms instalado.
# Los hooks de eventos de LuckPerms también actualizan inmediatamente los permisos
# de Grim en caché en configuraciones normales.
# Este respaldo periódico solo es necesario para cambios de permisos en línea no
# cubiertos por esos eventos, como un contexto personalizado de LuckPerms que no
# llame a signalContextUpdate, huecos de contexto en Fabric o un proveedor de
# permisos que no sea LuckPerms y cambie permisos en vivo.
# Usa -1 para desactivar el sondeo. Usa un valor positivo para actualizar cada X ticks.
update-permission-ticks: -1

config-flavor: V2
config-version: 24

# Staff-only diagnostic alert emitted only when Grim actually sends a movement
# correction/resync. It does not add VL and does not execute punishments.
# The normal Grim alert style is preserved; the verbose part tells you what the
# correction was related to, e.g. related=cobweb or related=normal,blink,packet_burst.
correction-diagnostics:
    enabled: true
    cooldown-ms: 125
    recent-check-window-ms: 750
    format: "%prefix% &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose% &8[p=%ping% tps=%tps% corr=%integrity_score%]"

# Preserves predicted fall debt across freeze/Blink stalls so packet silence cannot erase fall damage bookkeeping.
fall-integrity:
    enabled: true
    enforce-platform-fall-distance: true
    minimum-distance: 3.0
    maximum-enforced-distance: 256.0
    recovery-retention-ms: 8000
    disconnect-retention-ms: 60000

# Correlaciona evidencia independiente en ventanas corta/larga. El puntaje por si solo nunca castiga.
integrity-correlation:
    enabled: true
    short-window-ms: 2500
    long-window-ms: 15000
    decay-per-second: 0.18
    long-window-multiplier: 0.35
    retention-seconds: 30
    # Simulation repetido dentro del mismo contexto se agrupa como un episodio de evidencia.
    simulation-episodes:
        enabled: true
        window-ms: 1200
        repeated-weight-multiplier: 0.15
        max-contribution: 1.0
    weights:
        simulation: 0.5
        selective-stall: 3.0
        airborne-stall: 2.0
        packet-burst: 1.0
        no-fall: 2.5
        phase: 3.0
        cancelled-block-support: 2.5
        unsafe-disconnect: 3.0
        queued-action: 2.5
        inventory-frequency: 1.0
        fast-consume: 2.5
        regen-packet: 2.5
        packet-order: 1.5
        multi-action: 1.5
        attack-burst: 2.0
        block-place-burst: 1.5

# Agrega evidencia de frecuencia/burst sobre Timer, NegativeTimer y ConnectionStall de Grim.
packet-integrity:
    enabled: true
    legacy-gap-ms: 250
    modern-gap-ms: 700
    recovery-window-ms: 500
    minimum-burst-packets: 5
    minimum-transaction-advance: 2
    selective-stall-causal-window-ms: 2000
    short-window-limit: 7.0
    one-second-limit: 25.0
    flag-buffer: 2.0
    flag-cooldown-ms: 1500

# Reutiliza CompensatedInventory, PacketOrder, MultiActions y NoSlow; no duplica sus checks.
# v22 packet-driven Regen guard. Timer owns extra-tick cancellation; Regen adds dedicated VL.
regen-guard:
    enabled: true
    heal-correlation-window-ms: 1500
    packet-abuse-window-ms: 1200
    minimum-timer-ahead-ms: 35
    minimum-packets-250ms: 7
    minimum-heal-amount: 0.25
    minimum-confidence: 0.60
    flag-buffer: 2.0
    flag-cooldown-ms: 900
    prevent:
        enabled: true
        minimum-timer-ahead-ms: 80

Regen:
    setbackvl: -1
    decay: 0.15

interaction-integrity:
    enabled: true
    consume:
        enabled: true
        minimum-ratio: 0.72
        absolute-lenience-ms: 120
        stale-extra-ms: 3000
        flag-cooldown-ms: 1200
        require-item-match: true
        prevent:
            # Cancels the Bukkit consume event only when timing is impossible enough
            # and lag confidence is sufficient.
            enabled: true
            minimum-confidence: 0.60
    inventory-frequency:
        enabled: true
        short-limit: 7.0
        one-second-limit: 22.0
        four-second-limit: 60.0
        flag-buffer: 1.5
        flag-cooldown-ms: 1500
        # La frecuencia rápida normal queda como evidencia; requiere correlación de protocolo o un exceso extremo para marcar.
        require-protocol-correlation: true
        protocol-causal-window-ms: 1500
        standalone-extreme-ratio: 1.75

# La frecuencia de ataques solo se vuelve evidencia fuerte de Blink-combat junto con stall/burst.
combat-frequency:
    enabled: true
    burst-attacks: 4
    burst-window-ms: 350
    causal-window-ms: 1500
    flag-cooldown-ms: 1200

# Reduce confianza de evidencia heuristica durante lag del servidor; los checks deterministas de Grim siguen activos.
lag-protection:
    enabled: true
    minimum-tps: 17.0
    degraded-tps: 18.5
    tick-spike-ms: 250
    severe-tick-spike-ms: 1000
    degraded-confidence: 0.70
    severe-confidence: 0.30
    # Mantiene menor confianza heurística unos segundos tras un lag real del servidor porque los paquetes llegan después del pico.
    spike-recovery-ms: 2500
    severe-spike-recovery-ms: 4000
    player-network:
        high-jitter-ms: 120.0
        severe-jitter-ms: 250.0
        high-ping-ms: 300.0
        severe-ping-ms: 600.0
        unstable-confidence: 0.75
        severe-confidence: 0.50
        retention-seconds: 120

# Reutiliza el historial de bloques de Grim antes de marcar Phase justo despues de un cambio real del mundo.
# Capa contextual de Fase 4A. Solo ajusta confianza de Simulation heurístico; nunca desactiva Phase/Reach/Timer.
environment-context:
    enabled: true
    recent-block-change-ticks: 4
    simulation-multipliers:
        cobweb: 0.35
        stuck-movement: 0.50
        climbable: 0.55
        liquid: 0.60
        complex-collision: 0.70
        piston: 0.55
        recent-block-change: 0.55
    enforcement-multipliers:
        # These affect only the extra advantage-prevention layer, not Grim's predictor.
        # 1.0 = normal aggressiveness, lower values = more tolerance in special physics.
        cobweb: 0.15
        stuck-movement: 0.35
        climbable: 0.45
        liquid: 0.55
        complex-collision: 0.65
        piston: 0.45
        recent-block-change: 0.50

    correction-min-raw-offsets:
        # Raw Simulation offset required before a special-physics correction can occur.
        cobweb: 0.30
        stuck-movement: 0.22
        climbable: 0.18
        liquid: 0.18
        complex-collision: 0.12
        piston: 0.20
        recent-block-change: 0.15
    correction-policy:
        # v22: context names, not material IDs. Routine force-resyncs are deferred
        # during special physics while Phase and strong Simulation remain active.
        suppress-routine-force-resync-contexts:
          - COBWEB
          - STUCK_MOVEMENT
          - CLIMBABLE

world-integrity:
    phase-recent-block-grace-ticks: 4

    phase-protection:
        enabled: true
        immediate-setback: true

        protected-materials:
          - BARRIER

        protected-tags:
          - DOORS
          - TRAPDOORS
          - FENCE_GATES

        legacy-1_8-exemptions:
            enabled: true
            materials:
              - CHEST
              - TRAPPED_CHEST
            tags:
              - ANVIL

        source-resolution:
            search-padding-blocks: 1
            match-epsilon: 0.0000001



movement-enforcement:
    enabled: true

    environment:
        # Prevent a special movement state from leaving the player trapped by a stale safe position.
        recovery-ticks: 3
        recovery-multiplier: 0.70
        # Short-Blink heuristics are disabled only while special movement physics/recovery is active.
        # Simulation, Phase, Timer and the normal Grim predictor remain active.
        disable-short-blink: true
        # v22: special physics needs persistent, clearly impossible raw movement before correction.
        correction-strong-ticks: 3

    # Prediction evidence that is strong enough to stop the current position
    # from replacing Grim's last known safe position.
    quarantine-offset: 0.020

    # Repeated strong evidence can setback even when one individual offset
    # is below the severe threshold.
    strong-offset: 0.050
    severe-offset: 0.100
    strong-consecutive-ticks: 2

    # A quarantined player must move cleanly for this many checked movements
    # before positions are promoted as safe again.
    clean-recovery-ticks: 3

    immediate-setback: true
    ground-spoof-quarantine: true

    # Short Blink mitigation is prevention-only. A short network gap does not
    # become a standalone cheat flag. It only freezes safe-position promotion
    # and rolls back a compressed movement release when packet/transaction
    # evidence and gained distance are strong enough.
    short-blink:
        # Fallback only. v20 ConnectionStall owns Blink rollback to avoid duplicate setbacks.
        enabled: false
        min-gap-ms: 120
        max-gap-ms: 1000
        recovery-window-ms: 600
        burst-interval-ms: 50
        minimum-release-packets: 2
        minimum-transaction-advance: 1
        minimum-distance: 0.12
        minimum-confidence: 0.45

# Tracks placements cancelled by protection plugins (WorldGuard, build deny, etc.) so they cannot become client-only movement support.
cancelled-block-integrity:
    enabled: true
    retention-ms: 2500
    max-entries-per-player: 32

ExploitCancelledBlock:
    flag-after: 3
    setbackvl: 0
    decay: 0.20

# Bloquea ataques/colocaciones/roturas encoladas y liberadas despues de un stall selectivo confirmado.
StallActions:
    block-attacks: true
    block-places: true
    block-breaks: true
    block-use-items: true
    block-entity-interactions: true
    # Disabled by default to avoid inventory desync on heavily customized servers.
    block-inventory-clicks: false
    block-release-use-item: true
    flag-cooldown-ms: 750
    setbackvl: -1
    decay: 0.20

# Varias colocaciones distintas sin un tick de cliente entre ellas no son comportamiento vanilla.
MultiPlace:
    cancelVL: 2
