# Configuração padrão do GrimAC
# Código fonte: https://github.com/MWHunter/Grim
# Copyright 2025 DefineOutside e contribuidores, Sob licença GPLv3.
# Códigos modificados, ou plugins que utilizam o código do Grim, devem ser privados,
# ou seu código deve estar totalmente disponível para compradores sem quaisquer custos adicionais.

alerts:
    # SparkGrim Phase 3 only aggregates normal staff alerts; internal flags, logs, history and /grim verbose stay complete.
    enabled: true
    aggregation: true
    burst-summary: true
    cooldown-ms: 1500
    minimum-vl-gap: 5
    state-retention-seconds: 600
    milestones:
        - "1"
        - "5"
        - "10"
        - "15"
        - "20"
    severity:
        medium: 4.0
        high: 8.0
        critical: 14.0
    # Além de transmitir alertas para jogadores, eles deveriam ser transmitidos para o terminal também?
    print-to-console: true
    # Isso controla se/como os alertas são compartilhados entre os servidores conectados ao proxy.
    # Deve-se ter 'bungee-plugin-message-channel' habilitado na configuração do Velocity se estiver usando.
    proxy:
        # Deviam os alertas ser enviados para outros servidores conectados no mesmo proxy?
        send: false
        # Deviam os alertas ser recebidos de outros servidores conectados no mesmo proxy?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Isso signifia que, caso a marca do cliente seja igual às listadas abaixo, não será notificado aos
    # administradores.
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Esconde todos espectadores com a permissão 'grim.spectator' mesmo se não estiverem ativamente espectando.
    hide-regardless: false
    # Fará os espectadores serem escondidos apenas nos mundos listados abaixo, deixe em branco para habilitar em todos os mundos.
    allowed-worlds:
        - ""

# Quanto tempo os jogadores tem até expulsarmos eles por inatividade? Padrão = 60 segundos.
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# O manipulador padrão de ressincronização de blocos deve ser desativado?
# Por padrão, o Grim lê blocos do mundo do servidor e os envia ao cliente para corrigir a dessincronização.
# Se você usa plugins que criam blocos falsos baseados em pacotes (que não existem no mundo do servidor),
# você deve definir isso como true para evitar que o Grim os sobrescreva com ar/blocos reais.
# Isso força o uso de um manipulador "NoOp" (Sem Operação), a menos que um personalizado seja fornecido via API.
disable-default-resync-handler: false

# Deve-se cancelar o pacote de movimento duplicado?
# A Mojang arrumou esse erro na 1.21, sendo sua tentativa de concertar a dessincronização do balde. https://bugs.mojang.com/browse/MC-12363
# Isso só se aplica à clientes da 1.17-1.20.5 em servidores da 1.8.
cancel-duplicate-packet: true

# Deve-se ignorar rotação em pacotes duplicados?
ignore-duplicate-packet-rotation: false

Simulation:
    # Por quanto deve-se multiplicar a vantagem desde a última vez que falhou uma verificação?
    # Isso é como a configuração padrão se parece (eixo X = segundos, eixo Y = 1/1000 blocos): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # O quão longe o jogador deve estar da área simulada para registrar violações?
    # Medido em blocos do último movimento legítmo.
    # Incluímos o Optifine trocando as tabelas trigonométricas; entretanto, abaixar para 0.001 reduzirá o 'FastMath'
    # de falhar, caso essa compensação não funcionar.
    threshold: 0.001
    # O quão longe o jogador deve estar da área simulada para imediatamente recuá-lo?
    # -1 desabilitará
    immediate-setback-threshold: 0.1
    # Qual é a soma do desalinhamento da simulação em todos os ticks até começarmos a recuar?
    # -1 desabilitará
    max-advantage: 1
    # Depois de 50 segundos, com a configuração padrão, o jogador irá de 4 blocos a 1 bloco de vantagem.
    # Isso serve para previnir o jogador de alcançar violações demais e nunca conseguir se livrar delas.
    # Cela de vantagens padrão (eixo X = segundos, eixo Y = 1/1000 blocos): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Quantas violações para começar a recuar o jogador?
    # 1 para comportamento antigo
    setback-violation-threshold: 1

# Verifica se um jogador entrou em um bloco ao se mover.
Phase:
    setbackvl: 1 # Entrar em blocos possibilita escalar paredes, além disso, essa verificação é relativamente estável.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Verificação de NoSlow por simulação.
# Grim considera erros no netcode. Difícil de gerar falsos positivos, até mesmo spamando o blotão direito e a offhand.
# Muito mais estável que outros anticheats, mas por favor, reporte quaisquer falsos positivos. Eu já arrumei diversos
# erros de netcode.
NoSlow:
    # Quanto de desalinhamento é considerado trapaça?
    # Por padrão é menor que os outros.
    # Em 0.03-0.2 detecta com consistência.
    threshold: 0.001
    # Recuo imediato para inibir as vantagens rapidamente.
    setbackvl: 5
    # Decai quando o jogador usa um item e é efetivamente desacelerado.
    decay: 0.05

Knockback:
    # Por quanto deve-se multiplicar a vantagem desde a última vez que falhou na verificação?
    setback-decay-multiplier: 0.999
    # O quão longe da área do recuo recebido o jogador deve estar para registrar violações?
    # Medido em blocos do recuo recebido.
    threshold: 0.001
    # O quão longe o jogador deve estar da área simulada para imediatamente recuá-lo?
    # -1 desabilitará.
    immediate-setback-threshold: 0.1
    # Qual é a soma do desalinhamento da simulação em todos os ticks até começarmos a recuar?
    # -1 desabilitará.
    max-advantage: 1
    # Isso serve para previnir o jogador de alcançar violações demais e nunca conseguir se livrar delas.
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milissegundos que o jogador pode acumular para depois usar quando eles têm um atraso no ping.
    # Pode ignorar o uso de fast use / fast heal / fast bow na 1.8 caso o valor seja definido muito alto.
    # 120ms parece um bom balanceamento.
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping no qual a verificação vai começar a limitar o balançeamento do timer para previnir abuso.
    # Pode causar recuos a jogadores legítmos, mas somente se estiverem acima desse ping.
    # -1 desabilitará.
    ping-abuse-limit-threshold: 1000

    hard-prevention:
        # TimerA already cancels pure Timer abuse. This layer may cancel movement
        # when Blink/PacketBurst evidence exists, but Blink rollback is owned only
        # by ConnectionStall's one-shot hard-release barrier.
        enabled: true
        cancel-movement: true
        minimum-confidence: 0.55
        causal-window-ms: 1500
NegativeTimer:
    # Número de milissegundos perdidos ao se mover antes de começarmos a registrar violações.
    drift: 1200

# Mesmo método usado no TimerA, mas para veículos.
# Protects movement integrity when a client stops sending movement packets while the connection remains alive.
# This also powers combat-tag preservation during suspicious/ambiguous stalls.
integrity-profile: balanced

# Phase 4B Blink mitigation. Full connection freezes remain ambiguous; selective stalls require transaction progress.
blink-mitigation:
    enabled: true
    profile: balanced
    hard-release:
        # v20: a single movement gap NEVER causes a rollback by itself.
        # The first packet only arms a candidate; a second movement packet must arrive
        # inside burst-confirm-max-interval-ms to prove a compressed Blink release.
        enabled: true
        legacy-min-gap-ms: 120
        modern-min-gap-ms: 700
        max-gap-ms: 1600
        min-transaction-advance: 1
        minimum-confidence: 0.80
        burst-confirm-max-interval-ms: 35
        # Only the buffered tail is discarded. Accepted movement resumes immediately
        # after this short window; no repeated setback is allowed during recovery.
        cancel-window-ms: 180
        recovery-no-setback-ms: 600
        setback: true
        # A single confirmed release is prevention first. Repeated confirmed releases
        # become ConnectionStall evidence and can be sanctioned through punishments.yml.
        flag-after-repeats: 3
        repeat-window-ms: 8000
        flag-cooldown-ms: 3000
    recovery:
        max-ms: 8000
        min-movement-packets: 8
        min-transaction-advance: 2
    profiles:
        safe:
            legacy-watch-gap-ms: 450
            modern-watch-gap-ms: 1500
            airborne-watch-gap-ms: 650
            confirm-gap-ms: 1200
            min-transaction-advance: 5
            release-guard-min-gap-ms: 1400
            release-guard-min-transactions: 5
            release-guard-repeat-threshold: 3
            protect-full-freeze-airborne: false
        balanced:
            legacy-watch-gap-ms: 350
            modern-watch-gap-ms: 1200
            airborne-watch-gap-ms: 500
            confirm-gap-ms: 900
            min-transaction-advance: 3
            release-guard-min-gap-ms: 1000
            release-guard-min-transactions: 3
            release-guard-repeat-threshold: 2
            protect-full-freeze-airborne: false
        lockdown:
            legacy-watch-gap-ms: 300
            modern-watch-gap-ms: 900
            airborne-watch-gap-ms: 400
            confirm-gap-ms: 700
            min-transaction-advance: 2
            release-guard-min-gap-ms: 750
            release-guard-min-transactions: 2
            release-guard-repeat-threshold: 1
            protect-full-freeze-airborne: false

# Uses Grim's existing safe setback position once, only when a selective Blink release has enough evidence.
movement-release-guard:
    enabled: true
    cooldown-ms: 500
    retention-seconds: 120

movement-context-auto:
    enabled: true
    velocity-duration-ms: 900
    teleport-duration-ms: 1200
    cancelled-move-duration-ms: 300
    flight-duration-ms: 3000

ConnectionStall:
    enabled: true
    # Legacy 1.8 clients normally send a flying packet every tick, even while standing still.
    legacy-watch-gap-ms: 350
    # Modern clients may legally skip more movement packets while idle.
    modern-watch-gap-ms: 1200
    # Airborne gaps are more dangerous because they can suspend falling.
    airborne-watch-gap-ms: 500
    # A stall only becomes a cheat signal after this gap AND enough transaction replies continue.
    confirm-gap-ms: 900
    # Preserve historical combat on quit even if the final stall is shorter than the normal watch threshold.
    disconnect-protect-gap-ms: 150
    # Freeze combat time even for short sub-threshold stalls; this is protection only, not a cheat flag.
    combat-hold-gap-ms: 150
    modern-combat-hold-gap-ms: 500
    min-transaction-advance: 3
    # Full connection freezes can look legitimate, so this mitigates long airborne stalls without flagging them.
    ambiguous-airborne-setback-ms: 1500
    # Movement must remain clean this long before a protected combat tag resumes counting down.
    recovery-clean-ms: 2000
    flag-cooldown-ms: 3000
    join-grace-ms: 5000
    outside-combat-repeat-threshold: 2
    protect-airborne: true
    min-protected-fall-distance: 3.0
    setbackvl: 0
    decay: 0.10

# Independent PvP ledger used by ConnectionStall. It does not require CombatPlus or another combat plugin.
combat-integrity:
    enabled: true
    tag-seconds: 15
    # Minimum tag restored after a stall. This stops a short freeze at the final milliseconds from becoming a free escape.
    # Set to 0 if you want to preserve exactly the time that was left.
    resume-minimum-tag-ms: 3000
    pending-disconnect-window-seconds: 300
    # false = only disconnects connected to a protected stall are handled here.
    # Your normal combat plugin can keep handling ordinary combat-logouts.
    punish-all-combat-quits: false
    kill-on-unsafe-disconnect: true
    kill-on-next-join-if-needed: true
    block-commands: true
    silent-protection: true
    block-message: ""
    allowed-commands:
      - "msg"
      - "tell"
      - "r"
    providers:
        fallback-internal: true
        combatplus:
            enabled: true
            refresh-during-protection-ms: 1000

VehicleTimer:
    # Detecta até 1.005 de timer.
    setbackvl: 10

PacketOrderI:
    # Ativar se os jogadores estão sendo sinalizados por usar mods de animação 1.7
    exempt-placing-while-digging: false

Reach:
    # Por quanto deve-se expandir as caixas de colisão? 0.0005 deve detectar 3.0005+ de alcance.
    #
    # Há 0.03 de expansão forçada nas versões 1.9-1.18.1 (não a 1.18.2), ou algumas combinações de cliente/servidor por
    # conta de mudanças no protocolo e limitações. Essa verificação é mais poderosa com clientes da 1.7/1.8 em servidores
    # da 1.8.
    threshold: 0.0005
    # Deve-se cancelar hits que sabemos que são impossíveis?
    # O alcance de 3.00-3.03 pode acabar passando, por conta da ordem de pacotes, mas continuará registrando violações.
    block-impossible-hits: true
    # Isso enviará um pacote adicional no final de todos os ticks para aumentar a probabilidade de detectarmos trapaceiros.
    # Isso injeta na lista de conecção do servidor para envar um pacote final logo antes do servidor recarregar.
    # Habilitando isso, irá aumentar o uso de banda para todos os jogadores.
    # Isso não irá interferir na performance do servidor.
    # Habilitando isso, aumentará a probabilidade de detectarmos trapaceiros.
    # Deixando-o desabilitado, continuará detectando trapaceiros e não irá causar falsos positivos.
    # A menos que estiver em um servidor focado em PvP, esse pacote adicional não é recomendado.
    enable-post-packet: false

exploit:
    # Você pode ganhar altas velocidades se pular correndo com uma elytra, previne isso de ocorrer quando definido falso.
    # A Mojang vacilou com o netcode por fazer a Elytra iniciar pelo lado do cliente.
    # As Elytras levam 0.99 de fricção horizontal, então constantemente adicionando 0.2 de velocidade horizontal resulta
    # em velocidades altíssimas.
    allow-sprint-jumping-when-using-elytra: true
    # Essa opção mitiga posicionar blocos em blocos fantasma, ressincronizando o jogador quando isso ocorrer.
    allow-building-on-ghostblocks: false
    # Esse ajuste, influído pela opção acima, define a distância para verificar blocos fantasmas.
    # O valor válido é limitado de 2 a 4.
    distance-to-check-if-ghostblocks: 2

# Registra plugins que são injetados na netty ao entrar para depurar erros de compatibilidade.
debug-pipeline-on-join: false

# Habilita verificações experimentais.
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Grim às vezes cancela pacotes ilegais como com o timer, depois de X pacotes em um segundo que foram cancelados, quando
# deve-se simplesmente expulsar o jogador? Isso é requirido já que alguns limitadores de pacotes não contam pacotes
# cancelados pelo Grim.
packet-spam-threshold: 100
# Habilite isto para imprimir um stacktrace quando um jogador for expulso devido ao packet-spam-threshold
debug-packet-cancel: false
# Grim pode impor que o jogador fora do estado de voo não possa ter mais de X milissegundos de ping.
# Isso ocorre porque o Grim atualmente não verifica os jogadores que estão voando.
# -1 desabilitará.
max-ping-out-of-flying: 1000

# Ping máximo quando o impulso do foguete acaba.
# Previne jogadores com ping alto de usarem um foguete ara voar indefinidamente.
max-ping-firework-boost: 1000

# Marcadores de esquema — toque apenas se souber o que está fazendo.
#   config-flavor:  V2 = build do Grim 2.x, V3 = Grim 3.x. O plugin se recusa
#                   a carregar uma config cujo flavor não bate com seu próprio
#                   build; uma config V3 aberta por um jar V2 falha
#                   imediatamente em vez de mesclar silenciosamente em chaves
#                   erradas.
#   config-version: incrementado a cada mudança de forma incompatível. Configs
#                   antigas são migradas automaticamente pelo updater embutido
#                   na próxima inicialização.
# O Grim sempre atualiza as permissões em cache quando um jogador entra e quando
# o Grim é recarregado, esteja o LuckPerms instalado ou não.
# Os hooks de eventos do LuckPerms também atualizam imediatamente as permissões
# do Grim em cache em configurações normais.
# Este fallback periódico só é necessário para mudanças de permissões online não
# cobertas por esses eventos, como um contexto personalizado do LuckPerms que não
# chama signalContextUpdate, lacunas de contexto no Fabric ou um provedor de
# permissões diferente do LuckPerms que altera permissões ao vivo.
# Defina -1 para desativar a verificação periódica. Use um valor positivo para atualizar a cada X ticks.
update-permission-ticks: -1

config-flavor: V2
config-version: 21

# Staff-only diagnostic alert emitted only when Grim actually sends a movement
# correction/resync. It does not add VL and does not execute punishments.
# The normal Grim alert style is preserved; the verbose part tells you what the
# correction was related to, e.g. related=cobweb or related=normal,blink,packet_burst.
correction-diagnostics:
    enabled: true
    cooldown-ms: 125
    recent-check-window-ms: 750
    format: "%prefix% &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose% &8[p=%ping% tps=%tps% corr=%integrity_score%]"

# Preserves predicted fall debt across freeze/Blink stalls so packet silence cannot erase fall damage bookkeeping.
fall-integrity:
    enabled: true
    enforce-platform-fall-distance: true
    minimum-distance: 3.0
    maximum-enforced-distance: 256.0
    recovery-retention-ms: 8000
    disconnect-retention-ms: 60000

# Correlates independent evidence in short/long windows. It never punishes by score alone.
integrity-correlation:
    enabled: true
    short-window-ms: 2500
    long-window-ms: 15000
    decay-per-second: 0.18
    long-window-multiplier: 0.35
    retention-seconds: 30
    # Repeated Simulation flags from one continuous context are one evidence episode, not unlimited independent proof.
    simulation-episodes:
        enabled: true
        window-ms: 1200
        repeated-weight-multiplier: 0.15
        max-contribution: 1.0
    weights:
        simulation: 0.5
        selective-stall: 3.0
        airborne-stall: 2.0
        packet-burst: 1.0
        no-fall: 2.5
        phase: 3.0
        cancelled-block-support: 2.5
        unsafe-disconnect: 3.0
        queued-action: 2.5
        inventory-frequency: 1.0
        fast-consume: 2.5
        packet-order: 1.5
        multi-action: 1.5
        attack-burst: 2.0
        block-place-burst: 1.5

# Adds packet-rate/burst evidence on top of Grim Timer/NegativeTimer and ConnectionStall.
packet-integrity:
    enabled: true
    legacy-gap-ms: 250
    modern-gap-ms: 700
    recovery-window-ms: 500
    minimum-burst-packets: 5
    minimum-transaction-advance: 2
    selective-stall-causal-window-ms: 2000
    short-window-limit: 7.0
    one-second-limit: 25.0
    flag-buffer: 2.0
    flag-cooldown-ms: 1500

# Interaction integrity reuses CompensatedInventory, PacketOrder, MultiActions and NoSlow.
interaction-integrity:
    enabled: true
    consume:
        enabled: true
        minimum-ratio: 0.72
        absolute-lenience-ms: 120
        stale-extra-ms: 3000
        flag-cooldown-ms: 1200
        require-item-match: true
        prevent:
            # Cancels the Bukkit consume event only when timing is impossible enough
            # and lag confidence is sufficient.
            enabled: true
            minimum-confidence: 0.60
    inventory-frequency:
        enabled: true
        short-limit: 7.0
        one-second-limit: 22.0
        four-second-limit: 60.0
        flag-buffer: 1.5
        flag-cooldown-ms: 1500
        # Normal fast inventory use is evidence first; protocol correlation or an extreme ratio is required to flag.
        require-protocol-correlation: true
        protocol-causal-window-ms: 1500
        standalone-extreme-ratio: 1.75

# Attack frequency only becomes strong Blink-combat evidence when paired with stall/burst state.
combat-frequency:
    enabled: true
    burst-attacks: 4
    burst-window-ms: 350
    causal-window-ms: 1500
    flag-cooldown-ms: 1200

# Central confidence reduction for heuristic evidence during server lag. Deterministic Grim checks remain active.
lag-protection:
    enabled: true
    minimum-tps: 17.0
    degraded-tps: 18.5
    tick-spike-ms: 250
    severe-tick-spike-ms: 1000
    degraded-confidence: 0.70
    severe-confidence: 0.30
    # Keep reduced heuristic confidence briefly after a real server spike; the queued packets arrive after the bad tick ended.
    spike-recovery-ms: 2500
    severe-spike-recovery-ms: 4000
    player-network:
        high-jitter-ms: 120.0
        severe-jitter-ms: 250.0
        high-ping-ms: 300.0
        severe-ping-ms: 600.0
        unstable-confidence: 0.75
        severe-confidence: 0.50
        retention-seconds: 120

# Reuse Grim's own block history before Phase flags immediately after a real world change.
# Phase 4A context layer. It only changes confidence for heuristic Simulation evidence; it never disables Phase/Reach/Timer.
environment-context:
    enabled: true
    recent-block-change-ticks: 4
    simulation-multipliers:
        cobweb: 0.35
        stuck-movement: 0.50
        climbable: 0.55
        liquid: 0.60
        complex-collision: 0.70
        piston: 0.55
        recent-block-change: 0.55
    enforcement-multipliers:
        # These affect only the extra advantage-prevention layer, not Grim's predictor.
        # 1.0 = normal aggressiveness, lower values = more tolerance in special physics.
        cobweb: 0.15
        stuck-movement: 0.35
        climbable: 0.45
        liquid: 0.55
        complex-collision: 0.65
        piston: 0.45
        recent-block-change: 0.50

world-integrity:
    phase-recent-block-grace-ticks: 4

    phase-protection:
        enabled: true
        immediate-setback: true

        protected-materials:
          - BARRIER

        protected-tags:
          - DOORS
          - TRAPDOORS
          - FENCE_GATES

        legacy-1_8-exemptions:
            enabled: true
            materials:
              - CHEST
              - TRAPPED_CHEST
            tags:
              - ANVIL

        source-resolution:
            search-padding-blocks: 1
            match-epsilon: 0.0000001



movement-enforcement:
    enabled: true

    environment:
        # Prevent a special movement state from leaving the player trapped by a stale safe position.
        recovery-ticks: 3
        recovery-multiplier: 0.70
        # Short-Blink heuristics are disabled only while special movement physics/recovery is active.
        # Simulation, Phase, Timer and the normal Grim predictor remain active.
        disable-short-blink: true

    # Prediction evidence that is strong enough to stop the current position
    # from replacing Grim's last known safe position.
    quarantine-offset: 0.020

    # Repeated strong evidence can setback even when one individual offset
    # is below the severe threshold.
    strong-offset: 0.050
    severe-offset: 0.100
    strong-consecutive-ticks: 2

    # A quarantined player must move cleanly for this many checked movements
    # before positions are promoted as safe again.
    clean-recovery-ticks: 3

    immediate-setback: true
    ground-spoof-quarantine: true

    # Short Blink mitigation is prevention-only. A short network gap does not
    # become a standalone cheat flag. It only freezes safe-position promotion
    # and rolls back a compressed movement release when packet/transaction
    # evidence and gained distance are strong enough.
    short-blink:
        # Fallback only. v20 ConnectionStall owns Blink rollback to avoid duplicate setbacks.
        enabled: false
        min-gap-ms: 120
        max-gap-ms: 1000
        recovery-window-ms: 600
        burst-interval-ms: 50
        minimum-release-packets: 2
        minimum-transaction-advance: 1
        minimum-distance: 0.12
        minimum-confidence: 0.45

# Tracks placements cancelled by protection plugins (WorldGuard, build deny, etc.) so they cannot become client-only movement support.
cancelled-block-integrity:
    enabled: true
    retention-ms: 2500
    max-entries-per-player: 32

ExploitCancelledBlock:
    flag-after: 3
    setbackvl: 0
    decay: 0.20

# Blocks queued attacks/places/breaks released after a confirmed selective packet stall.
StallActions:
    block-attacks: true
    block-places: true
    block-breaks: true
    block-use-items: true
    block-entity-interactions: true
    # Disabled by default to avoid inventory desync on heavily customized servers.
    block-inventory-clicks: false
    block-release-use-item: true
    flag-cooldown-ms: 750
    setbackvl: -1
    decay: 0.20

# Multiple distinct placements without an intervening client tick are not vanilla behavior.
MultiPlace:
    cancelVL: 2
