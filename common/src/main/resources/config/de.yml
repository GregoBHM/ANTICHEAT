# GrimAC Hauptkonfiguration
# Quellcode: https://github.com/MWHunter/Grim
# Copyright 2025 DefineOutside und Mitwirkende, lizenziert unter GPLv3.
# Modifizierte Binärdateien, oder Plugins mit kopiertem Grim-Code, müssen privat sein,
# oder mit vollständigem Quellcode für Käufer ohne zusätzliche Kosten verfügbar sein.

alerts:
    # SparkGrim Phase 3 only aggregates normal staff alerts; internal flags, logs, history and /grim verbose stay complete.
    enabled: true
    aggregation: true
    burst-summary: true
    cooldown-ms: 1500
    minimum-vl-gap: 5
    state-retention-seconds: 600
    milestones:
        - "1"
        - "5"
        - "10"
        - "15"
        - "20"
    severity:
        medium: 4.0
        high: 8.0
        critical: 14.0
    # Sollen die Warnungen nicht nur an die Spieler, sondern auch an die Konsole gesendet werden?
    print-to-console: true
    # Dies steuert, ob/wie Warnungen zwischen Servern, die mit Ihrem Proxy verbunden sind, geteilt werden.
    # Sie müssen 'bungee-plugin-message-channel' in Ihrer Velocity-Konfiguration aktiviert haben, wenn Velocity verwendet wird.
    proxy:
        # Sollen Warnungen an andere Server gesendet werden, die mit Ihrem Proxy verbunden sind?
        send: false
        # Sollen die von anderen Servern empfangenen Alarme diesem Server mitgeteilt werden?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # Das bedeutet, dass die Marke nicht an die Betreiber weitergegeben wird, wenn die Marke mit den folgenden Regexes übereinstimmt
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Alle Zuschauer mit der Berechtigung grim.spectator ausblenden, unabhängig davon, ob sie tatsächlich aktiv zuschauen
    hide-regardless: false
    # Die Zuschauer werden nur in diesen Welten versteckt, um alle Welten zuzulassen, bleiben sie leer.
    allowed-worlds:
        - ""

# Wie lange sollen Spieler Zeit haben, bis wir sie wegen Zeitüberschreitung rauswerfen? Standard = 60 Sekunden
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Sollte der Standard-Handler für die Block-Resynchronisierung deaktiviert werden?
# Standardmäßig liest Grim Blöcke aus der Serverwelt und sendet sie an den Client, um Desyncs zu beheben.
# Wenn Sie Plugins verwenden, die gefälschte paketbasierte Blöcke erstellen (die in der Serverwelt nicht existieren),
# sollten Sie dies auf true setzen, um zu verhindern, dass Grim sie mit Luft/echten Blöcken überschreibt.
# Dies erzwingt die Verwendung eines "NoOp" (No Operation) Handlers, es sei denn, über die API wird ein eigener bereitgestellt.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # Mit wie viel soll der Gesamtvorteil multipliziert werden, wenn der Spieler legitim ist.
    # So sieht die Standardkonfiguration aus (x-Achse = Sekunden, y-Achse = 1/1000 Block): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # Wie groß sollte der Abstand zur Bewegung des Spielers sein, um eine Verletzung zu erzeugen?
    # Gemessen in Blöcken von der möglichen Bewegung.
    # Wir berücksichtigen Optifine, indem wir die Triggertabellen wechseln, aber wenn wir dies auf 0,001 senken, wird FastMath reduziert.
    # Markierung des Anticheats, wenn diese Kompensation nicht funktioniert...
    threshold: 0.001
    # Wie groß ist der Verstoß in einem Tick, bevor der Spieler sofort zurückgesetzt wird?
    # -1 zum Deaktivieren
    immediate-setback-threshold: 0.1
    # Wie groß ist der Vorsprung gegenüber allen Ticks, bevor wir einen Rückschlag erleiden?
    # -1 zum Deaktivieren
    max-advantage: 1
    # Nach 50 Sekunden mit der Standardkonfiguration geht der Spieler von 4 Blöcken -> 1 Block Vorteil
    # Dies soll verhindern, dass der Spieler zu viele Verstöße sammelt und nie in der Lage ist, sie alle zu beseitigen.
    # Standard-Vorteilsgrenze (x-Achse = Sekunden, y-Achse = 1/1000 Block): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Schwellenwert für die Verletzungsstufe für den Rückschlag
    # 1 für das alte Verhalten
    setback-violation-threshold: 1

# Überprüft, ob ein Spieler während einer Bewegung einen Block betreten hat.
Phase:
    setbackvl: 1 # Glitching in Blöcken kann das Klettern an der Wand ermöglichen, außerdem ist dieser Check relativ stabil.
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Prediction-based no slow check
# Grim ist verantwortlich für den fehlerhaften Netcode hier... schwer zu falsen, selbst wenn man Rechtsklick und Offhand-Taste spammt.
# Viel stabiler als andere Anticheats, aber bitte melde alle Falses... Ich habe hier eine Menge Netcode-Probleme behoben.
NoSlow:
    # Wie viel von einem Offset ist "schummeln"
    # Standardmäßig ist dieser Wert niedriger als andere Offs.
    # Flags um 0,03-0,2 konsequent mit NoSlow on
    threshold: 0.001
    # Schnell auf das erste Element zurücksetzen, um jeden Vorteil von NoSlow zu beseitigen
    setbackvl: 5
    # Verfall ist, wenn der Spieler einen Gegenstand benutzt UND dadurch verlangsamt wird
    decay: 0.05

Knockback:
    # Mit wie viel soll der Gesamtvorteil multipliziert werden, wenn der Spieler legitim ist.
    setback-decay-multiplier: 0.999
    # Wie groß sollte der Abstand zur Bewegung des Spielers sein, um eine Verletzung zu erzeugen?
    # Gemessen in Blöcken von der möglichen Bewegung.
    threshold: 0.001
    # Wie groß ist der Verstoß in einem Tick, bevor der Spieler sofort zurückgesetzt wird?
    # -1 zum Deaktivieren
    immediate-setback-threshold: 0.1
    # Wie groß ist der Vorsprung gegenüber allen Ticks, bevor wir einen Rückschlag erleiden?
    # -1 zum Deaktivieren
    max-advantage: 1
    # Dies soll verhindern, dass der Spieler zu viele Verstöße sammelt und nie in der Lage ist, sie alle zu beseitigen.
    max-ceiling: 4

    # v22: AntiKB owns velocity mitigation instead of teleporting the player.
    enforcement:
        enabled: true
        cooldown-ms: 120
        recovery-ms: 350
        episode-reset-ms: 1200
        max-retries: 2
        minimum-reapply-scale: 0.35
        suppress-in-special-environments: true

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Millisekunden, die der Spieler akkumulieren kann, um sie später zu nutzen, wenn er zurückfällt.
    # Könnte möglicherweise 1,8 schnelle Nutzung/schnelle Heilung/schnelle Bogenumgehungen ermöglichen, wenn zu hoch eingestellt, 120 ms scheint eine gute Balance zu sein
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

    hard-prevention:
        # TimerA already cancels pure Timer abuse. This layer may cancel movement
        # when Blink/PacketBurst evidence exists, but Blink rollback is owned only
        # by ConnectionStall's one-shot hard-release barrier.
        enabled: true
        cancel-movement: true
        minimum-confidence: 0.55
        causal-window-ms: 1500
NegativeTimer:
    # Anzahl der Millisekunden, die während der Bewegung verloren gehen, bevor mit der Markierung begonnen werden sollte.
    drift: 1200

# Gleiche Prüfmethode wie TimerA, aber für Fahrzeuge
# Protects movement integrity when a client stops sending movement packets while the connection remains alive.
# This also powers combat-tag preservation during suspicious/ambiguous stalls.
integrity-profile: balanced

# Phase 4B Blink mitigation. Full connection freezes remain ambiguous; selective stalls require transaction progress.
blink-mitigation:
    enabled: true
    profile: balanced
    hard-release:
        # v20: a single movement gap NEVER causes a rollback by itself.
        # The first packet only arms a candidate; a second movement packet must arrive
        # inside burst-confirm-max-interval-ms to prove a compressed Blink release.
        enabled: true
        legacy-min-gap-ms: 80
        modern-min-gap-ms: 700
        # Threshold used only to label LONG_SELECTIVE releases. It is NOT an
        # upper limit anymore; long selective stalls remain preventable.
        long-selective-threshold-ms: 1600
        min-transaction-advance: 1
        # Player ping/jitter confidence gates sanction/VL, not prevention.
        sanction-minimum-confidence: 0.80
        # Prevention is disabled only when the SERVER itself is unhealthy.
        prevention-minimum-server-confidence: 0.55
        burst-confirm-max-interval-ms: 100
        # Only the buffered tail is discarded. Accepted movement resumes immediately
        # after this short window; no repeated setback is allowed during recovery.
        cancel-window-ms: 180
        recovery-no-setback-ms: 600
        setback: true
        # A single confirmed release is prevention first. Repeated confirmed releases
        # become ConnectionStall evidence and can be sanctioned through punishments.yml.
        flag-after-repeats: 3
        repeat-window-ms: 8000
        flag-cooldown-ms: 3000
    short-selective-action-guard:
        # Legacy close-range Blink guard: only selective transaction progress plus
        # a missing movement stream can block an action. A plain gap/high ping does not.
        enabled: true
        # Modern clients can legally skip movement packets while idle. Keep
        # action-first blocking off there until explicitly validated for production.
        modern-enabled: false
        legacy-min-gap-ms: 80
        modern-min-gap-ms: 700
        min-transaction-advance: 1
        minimum-server-confidence: 0.55
    # Ambiguous full freezes are prevention-only: protect the safe position and
    # queued actions briefly after release, but do not add VL by themselves.
    full-freeze-protection:
        enabled: true
        min-gap-ms: 1500
        release-protect-ms: 350
    recovery:
        max-ms: 8000
        min-movement-packets: 8
        min-transaction-advance: 2
    profiles:
        safe:
            legacy-watch-gap-ms: 450
            modern-watch-gap-ms: 1500
            airborne-watch-gap-ms: 650
            confirm-gap-ms: 1200
            min-transaction-advance: 5
            release-guard-min-gap-ms: 1400
            release-guard-min-transactions: 5
            release-guard-repeat-threshold: 3
            protect-full-freeze-airborne: false
        balanced:
            legacy-watch-gap-ms: 350
            modern-watch-gap-ms: 1200
            airborne-watch-gap-ms: 500
            confirm-gap-ms: 900
            min-transaction-advance: 3
            release-guard-min-gap-ms: 1000
            release-guard-min-transactions: 3
            release-guard-repeat-threshold: 2
            protect-full-freeze-airborne: false
        lockdown:
            legacy-watch-gap-ms: 300
            modern-watch-gap-ms: 900
            airborne-watch-gap-ms: 400
            confirm-gap-ms: 700
            min-transaction-advance: 2
            release-guard-min-gap-ms: 750
            release-guard-min-transactions: 2
            release-guard-repeat-threshold: 1
            protect-full-freeze-airborne: false

# Uses Grim's existing safe setback position once, only when a selective Blink release has enough evidence.
movement-release-guard:
    enabled: true
    cooldown-ms: 500
    retention-seconds: 120

movement-context-auto:
    enabled: true
    velocity-duration-ms: 900
    teleport-duration-ms: 1200
    cancelled-move-duration-ms: 300
    flight-duration-ms: 3000

ConnectionStall:
    enabled: true
    # Legacy 1.8 clients normally send a flying packet every tick, even while standing still.
    legacy-watch-gap-ms: 350
    # Modern clients may legally skip more movement packets while idle.
    modern-watch-gap-ms: 1200
    # Airborne gaps are more dangerous because they can suspend falling.
    airborne-watch-gap-ms: 500
    # A stall only becomes a cheat signal after this gap AND enough transaction replies continue.
    confirm-gap-ms: 900
    # Preserve historical combat on quit even if the final stall is shorter than the normal watch threshold.
    disconnect-protect-gap-ms: 150
    # Freeze combat time even for short sub-threshold stalls; this is protection only, not a cheat flag.
    combat-hold-gap-ms: 150
    modern-combat-hold-gap-ms: 500
    min-transaction-advance: 3
    # Full connection freezes can look legitimate, so this mitigates long airborne stalls without flagging them.
    ambiguous-airborne-setback-ms: 1500
    # Movement must remain clean this long before a protected combat tag resumes counting down.
    recovery-clean-ms: 2000
    flag-cooldown-ms: 3000
    join-grace-ms: 5000
    outside-combat-repeat-threshold: 2
    protect-airborne: true
    min-protected-fall-distance: 3.0
    setbackvl: 0
    decay: 0.10

# Independent PvP ledger used by ConnectionStall. It does not require CombatPlus or another combat plugin.
combat-integrity:
    enabled: true
    tag-seconds: 15
    # Minimum tag restored after a stall. This stops a short freeze at the final milliseconds from becoming a free escape.
    # Set to 0 if you want to preserve exactly the time that was left.
    resume-minimum-tag-ms: 3000
    pending-disconnect-window-seconds: 300
    # false = only disconnects connected to a protected stall are handled here.
    # Your normal combat plugin can keep handling ordinary combat-logouts.
    punish-all-combat-quits: false
    kill-on-unsafe-disconnect: true
    kill-on-next-join-if-needed: true
    block-commands: true
    silent-protection: true
    block-message: ""
    allowed-commands:
      - "msg"
      - "tell"
      - "r"
    providers:
        fallback-internal: true
        combatplus:
            enabled: true
            refresh-during-protection-ms: 1000

VehicleTimer:
    # Ziel 1,005 Timer
    setbackvl: 10

VehicleC:
    setbackvl: 25

PacketOrderI:
    # Aktivieren, wenn Spieler markiert werden, weil sie 1.7-Animationsmods verwenden
    exempt-placing-while-digging: false

Reach:
    # Um wie viel sollen wir die Hitboxen erweitern? 0,0005 sollte 3,0005+ Reichweite erkennen
    #
    # Es gibt eine 0,03 erzwungene Erweiterung mit 1.9-1.18.1 (nicht 1.18.2), oder einigen Client/Server-Kombinationen aufgrund von
    # Protokolländerungen und -beschränkungen. Diese Prüfung ist am stärksten mit 1.7/1.8 Clients auf 1.8 Servern.
    threshold: 0.0005
    # Sollten wir Treffer annullieren, von denen wir wissen, dass sie unmöglich sind?
    # 3.00-3.03-Treffer können aufgrund von Beschränkungen der Paketreihenfolge durchgehen, aber dennoch gekennzeichnet werden.
    block-impossible-hits: true
    # Dies sendet ein zusätzliches Paket am Ende jedes Ticks, um die Wahrscheinlichkeit zu erhöhen, dass Betrüger erwischt werden.
    # Dies injiziert in die Verbindungsliste des Servers, um ein letztes Paket zu senden, kurz bevor der Server geleert wird.
    # Aktivieren dieser Funktion erhöht die Bandbreitennutzung für alle Spieler.
    # Dies wird die Gesamtleistung des Servers nicht verringern.
    # Aktivieren Sie diese Option, um mehr Cheater zu erwischen.
    # Bleibt diese Funktion deaktiviert, werden immer noch Cheater erwischt und es kommt nicht zu Fehlalarmen.
    # Sofern es sich nicht um einen 1.8 PvP-Server handelt, wird dieses zusätzliche Paket nicht empfohlen.
    enable-post-packet: false

exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Diese Option verhindert das Platzieren von Geisterblöcken auf weitere Geisterblöcke, indem der Spieler neu synchronisiert wird.
    allow-building-on-ghostblocks: false
    # Diese Option, abhängig von der oben genannten Einstellung, definiert wie weit man nach Geisterblöcken suchen soll
    # Ihr gültiger Bereich ist von 2 bis 4 begrenzt
    distance-to-check-if-ghostblocks: 2

# Aktivieren Sie die Protokollierung von Plugins, die in netty on join injiziert wurden, um Kompatibilitätsprobleme zu beheben.
debug-pipeline-on-join: false

# Aktiviert experimentelle Prüfungen
experimental-checks: false

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# Grim bricht manchmal illegale Pakete ab, z.B. mit Timer, nachdem X Pakete in einer Sekunde abgebrochen wurden, wann sollte
# wir den Spieler einfach kicken? Dies ist erforderlich, da einige Paketbegrenzer die von Grim abgebrochenen Pakete nicht zählen.
packet-spam-threshold: 100
# Aktiviere dies, um einen Stacktrace auszugeben, wenn ein Spieler wegen packet-spam-threshold gekickt wird
debug-packet-cancel: false

# Grim kann erzwingen, dass ein Spieler, der aus dem Flugzustand gesetzt wurde, nicht mehr als X ms Ping haben darf
# Dies liegt daran, dass Grim derzeit fliegende Spieler nicht überprüft
# Zum Deaktivieren -1 verwenden
max-ping-out-of-flying: 1000

# Maximale Latenz, wenn ein Feuerwerks‑Boost vom Spieler entfernt wird.
# Dies verhindert, dass Spieler mit hoher Latenz einen einzigen Feuerwerks‑Boost mit Elytra unbegrenzt nutzen können.
max-ping-firework-boost: 1000

# Schema-Marker — nur ändern, wenn du weißt, was du tust.
#   config-flavor:  V2 = Grim-2.x-Build, V3 = Grim-3.x. Das Plugin lehnt eine
#                   Config ab, deren Flavor nicht zum eigenen Build passt —
#                   eine V3-Config, die von einer V2-Jar geladen wird, scheitert
#                   sofort, statt stillschweigend in falsche Schlüssel zu mergen.
#   config-version: wird bei jeder inkompatiblen Schemaänderung erhöht. Alte
#                   Configs werden beim nächsten Start automatisch vom
#                   mitgelieferten Updater migriert.
# Grim aktualisiert zwischengespeicherte Berechtigungen immer, wenn ein Spieler beitritt
# und wenn Grim neu geladen wird, unabhängig davon, ob LuckPerms installiert ist.
# LuckPerms-Event-Hooks aktualisieren zwischengespeicherte Grim-Berechtigungen
# in normalen Setups ebenfalls sofort.
# Dieser periodische Fallback wird nur für Online-Berechtigungsänderungen benötigt,
# die nicht von diesen Events abgedeckt werden, z. B. ein benutzerdefinierter
# LuckPerms-Kontext, der signalContextUpdate nicht aufruft, Lücken bei Fabric-Kontexten
# oder ein Nicht-LuckPerms-Berechtigungsanbieter, der Berechtigungen live ändert.
# Setze auf -1, um Polling zu deaktivieren. Setze einen positiven Wert, um alle X Ticks zu aktualisieren.
update-permission-ticks: -1

config-flavor: V2
config-version: 24

# Staff-only diagnostic alert emitted only when Grim actually sends a movement
# correction/resync. It does not add VL and does not execute punishments.
# The normal Grim alert style is preserved; the verbose part tells you what the
# correction was related to, e.g. related=cobweb or related=normal,blink,packet_burst.
correction-diagnostics:
    enabled: true
    cooldown-ms: 125
    recent-check-window-ms: 750
    format: "%prefix% &f%player% &bfailed &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose% &8[p=%ping% tps=%tps% corr=%integrity_score%]"

# Preserves predicted fall debt across freeze/Blink stalls so packet silence cannot erase fall damage bookkeeping.
fall-integrity:
    enabled: true
    enforce-platform-fall-distance: true
    minimum-distance: 3.0
    maximum-enforced-distance: 256.0
    recovery-retention-ms: 8000
    disconnect-retention-ms: 60000

# Correlates independent evidence in short/long windows. It never punishes by score alone.
integrity-correlation:
    enabled: true
    short-window-ms: 2500
    long-window-ms: 15000
    decay-per-second: 0.18
    long-window-multiplier: 0.35
    retention-seconds: 30
    # Repeated Simulation flags from one continuous context are one evidence episode, not unlimited independent proof.
    simulation-episodes:
        enabled: true
        window-ms: 1200
        repeated-weight-multiplier: 0.15
        max-contribution: 1.0
    weights:
        simulation: 0.5
        selective-stall: 3.0
        airborne-stall: 2.0
        packet-burst: 1.0
        no-fall: 2.5
        phase: 3.0
        cancelled-block-support: 2.5
        unsafe-disconnect: 3.0
        queued-action: 2.5
        inventory-frequency: 1.0
        fast-consume: 2.5
        regen-packet: 2.5
        packet-order: 1.5
        multi-action: 1.5
        attack-burst: 2.0
        block-place-burst: 1.5

# Adds packet-rate/burst evidence on top of Grim Timer/NegativeTimer and ConnectionStall.
packet-integrity:
    enabled: true
    legacy-gap-ms: 250
    modern-gap-ms: 700
    recovery-window-ms: 500
    minimum-burst-packets: 5
    minimum-transaction-advance: 2
    selective-stall-causal-window-ms: 2000
    short-window-limit: 7.0
    one-second-limit: 25.0
    flag-buffer: 2.0
    flag-cooldown-ms: 1500

# Interaction integrity reuses CompensatedInventory, PacketOrder, MultiActions and NoSlow.
# v22 packet-driven Regen guard. Timer owns extra-tick cancellation; Regen adds dedicated VL.
regen-guard:
    enabled: true
    heal-correlation-window-ms: 1500
    packet-abuse-window-ms: 1200
    minimum-timer-ahead-ms: 35
    minimum-packets-250ms: 7
    minimum-heal-amount: 0.25
    minimum-confidence: 0.60
    flag-buffer: 2.0
    flag-cooldown-ms: 900
    prevent:
        enabled: true
        minimum-timer-ahead-ms: 80

Regen:
    setbackvl: -1
    decay: 0.15

interaction-integrity:
    enabled: true
    consume:
        enabled: true
        minimum-ratio: 0.72
        absolute-lenience-ms: 120
        stale-extra-ms: 3000
        flag-cooldown-ms: 1200
        require-item-match: true
        prevent:
            # Cancels the Bukkit consume event only when timing is impossible enough
            # and lag confidence is sufficient.
            enabled: true
            minimum-confidence: 0.60
    inventory-frequency:
        enabled: true
        short-limit: 7.0
        one-second-limit: 22.0
        four-second-limit: 60.0
        flag-buffer: 1.5
        flag-cooldown-ms: 1500
        # Normal fast inventory use is evidence first; protocol correlation or an extreme ratio is required to flag.
        require-protocol-correlation: true
        protocol-causal-window-ms: 1500
        standalone-extreme-ratio: 1.75

# Attack frequency only becomes strong Blink-combat evidence when paired with stall/burst state.
combat-frequency:
    enabled: true
    burst-attacks: 4
    burst-window-ms: 350
    causal-window-ms: 1500
    flag-cooldown-ms: 1200

# Central confidence reduction for heuristic evidence during server lag. Deterministic Grim checks remain active.
lag-protection:
    enabled: true
    minimum-tps: 17.0
    degraded-tps: 18.5
    tick-spike-ms: 250
    severe-tick-spike-ms: 1000
    degraded-confidence: 0.70
    severe-confidence: 0.30
    # Keep reduced heuristic confidence briefly after a real server spike; the queued packets arrive after the bad tick ended.
    spike-recovery-ms: 2500
    severe-spike-recovery-ms: 4000
    player-network:
        high-jitter-ms: 120.0
        severe-jitter-ms: 250.0
        high-ping-ms: 300.0
        severe-ping-ms: 600.0
        unstable-confidence: 0.75
        severe-confidence: 0.50
        retention-seconds: 120

# Reuse Grim's own block history before Phase flags immediately after a real world change.
# Phase 4A context layer. It only changes confidence for heuristic Simulation evidence; it never disables Phase/Reach/Timer.
environment-context:
    enabled: true
    recent-block-change-ticks: 4
    simulation-multipliers:
        cobweb: 0.35
        stuck-movement: 0.50
        climbable: 0.55
        liquid: 0.60
        complex-collision: 0.70
        piston: 0.55
        recent-block-change: 0.55
    enforcement-multipliers:
        # These affect only the extra advantage-prevention layer, not Grim's predictor.
        # 1.0 = normal aggressiveness, lower values = more tolerance in special physics.
        cobweb: 0.15
        stuck-movement: 0.35
        climbable: 0.45
        liquid: 0.55
        complex-collision: 0.65
        piston: 0.45
        recent-block-change: 0.50

    correction-min-raw-offsets:
        # Raw Simulation offset required before a special-physics correction can occur.
        cobweb: 0.30
        stuck-movement: 0.22
        climbable: 0.18
        liquid: 0.18
        complex-collision: 0.12
        piston: 0.20
        recent-block-change: 0.15
    correction-policy:
        # v22: context names, not material IDs. Routine force-resyncs are deferred
        # during special physics while Phase and strong Simulation remain active.
        suppress-routine-force-resync-contexts:
          - COBWEB
          - STUCK_MOVEMENT
          - CLIMBABLE

world-integrity:
    phase-recent-block-grace-ticks: 4

    phase-protection:
        enabled: true
        immediate-setback: true

        protected-materials:
          - BARRIER

        protected-tags:
          - DOORS
          - TRAPDOORS
          - FENCE_GATES

        legacy-1_8-exemptions:
            enabled: true
            materials:
              - CHEST
              - TRAPPED_CHEST
            tags:
              - ANVIL

        source-resolution:
            search-padding-blocks: 1
            match-epsilon: 0.0000001



movement-enforcement:
    enabled: true

    environment:
        # Prevent a special movement state from leaving the player trapped by a stale safe position.
        recovery-ticks: 3
        recovery-multiplier: 0.70
        # Short-Blink heuristics are disabled only while special movement physics/recovery is active.
        # Simulation, Phase, Timer and the normal Grim predictor remain active.
        disable-short-blink: true
        # v22: special physics needs persistent, clearly impossible raw movement before correction.
        correction-strong-ticks: 3

    # Prediction evidence that is strong enough to stop the current position
    # from replacing Grim's last known safe position.
    quarantine-offset: 0.020

    # Repeated strong evidence can setback even when one individual offset
    # is below the severe threshold.
    strong-offset: 0.050
    severe-offset: 0.100
    strong-consecutive-ticks: 2

    # A quarantined player must move cleanly for this many checked movements
    # before positions are promoted as safe again.
    clean-recovery-ticks: 3

    immediate-setback: true
    ground-spoof-quarantine: true

    # Short Blink mitigation is prevention-only. A short network gap does not
    # become a standalone cheat flag. It only freezes safe-position promotion
    # and rolls back a compressed movement release when packet/transaction
    # evidence and gained distance are strong enough.
    short-blink:
        # Fallback only. v20 ConnectionStall owns Blink rollback to avoid duplicate setbacks.
        enabled: false
        min-gap-ms: 120
        max-gap-ms: 1000
        recovery-window-ms: 600
        burst-interval-ms: 50
        minimum-release-packets: 2
        minimum-transaction-advance: 1
        minimum-distance: 0.12
        minimum-confidence: 0.45

# Tracks placements cancelled by protection plugins (WorldGuard, build deny, etc.) so they cannot become client-only movement support.
cancelled-block-integrity:
    enabled: true
    retention-ms: 2500
    max-entries-per-player: 32

ExploitCancelledBlock:
    flag-after: 3
    setbackvl: 0
    decay: 0.20

# Blocks queued attacks/places/breaks released after a confirmed selective packet stall.
StallActions:
    block-attacks: true
    block-places: true
    block-breaks: true
    block-use-items: true
    block-entity-interactions: true
    # Disabled by default to avoid inventory desync on heavily customized servers.
    block-inventory-clicks: false
    block-release-use-item: true
    flag-cooldown-ms: 750
    setbackvl: -1
    decay: 0.20

# Multiple distinct placements without an intervening client tick are not vanilla behavior.
MultiPlace:
    cancelVL: 2
