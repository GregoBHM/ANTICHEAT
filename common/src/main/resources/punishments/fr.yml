# %check_name% - Nom de la vérification
# %description% - description of the check
# %vl% - Violations
# %verbose% - Informations supplémentaires
# %player% - Nom du joueur
# [alert] - Commande spéciale pour alerter
# [webhook] - Commande spéciale pour alerter via un Webhook Discord
# [proxy] - Commande spéciale pour alerter les autres serveurs connectés à votre proxy (BungeeCord/Velocity)
# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
# Automatic sanctions use a separate high-confidence ledger. Raw VL/logs stay complete.
sanctions:
  minimum-confidence: 0.80
  minimum-server-confidence: 0.80
  minimum-player-confidence: 0.80
  minimum-tps: 18.0
  # Compatibility safety: old sanction_vl kick conditions are ignored by
  # default for non-crash checks. Set true only to intentionally restore them.
  legacy-vl-actions-enabled: false
  legacy-1_8:
    # On a 1.8.8 backend, translated modern clients still get prevention and
    # alerts, but combat geometry/velocity cannot create autonomous sanctions.
    native-sensitive-sanctions-only: true


# Phase 3A: automatic sanctions are driven by newly confirmed physical episodes,
# never by raw VL. This phase is deliberately kick-only; bans are not accepted.
episode-sanctions:
  enabled: true
  families:
    timer:
      enabled: true
      minimum-episodes-10m: 4
      minimum-episodes-2h: 6
      minimum-confidence: 0.90
      minimum-integrity-score: 0.0
      command: "kick %player% Repeated confirmed Timer abuse detected by SparkGrim."
    velocity:
      enabled: true
      minimum-episodes-10m: 4
      minimum-episodes-2h: 6
      minimum-confidence: 0.90
      minimum-integrity-score: 4.0
      command: "kick %player% Repeated confirmed invalid knockback detected by SparkGrim."
    combat:
      enabled: true
      minimum-episodes-10m: 4
      minimum-episodes-2h: 6
      minimum-confidence: 0.90
      minimum-integrity-score: 0.0
      command: "kick %player% Repeated confirmed invalid combat interactions detected by SparkGrim."

Punishments:
