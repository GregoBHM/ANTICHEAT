# %check_name% - nome da verificação
# %description% - descrição da verificação
# %vl% - violações
# %verbose% - informação extra
# %player% - nome do jogador
# [alert] - comando especial para alertar
# [webhook] - comando especial para alertar com a webhook do discord
# [proxy] - comando especial para notificar os outros servidores conectados no mesmo proxy (BungeeCord/Velocity)
# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
# Automatic sanctions use a separate high-confidence ledger. Raw VL/logs stay complete.
sanctions:
  minimum-confidence: 0.80
  minimum-server-confidence: 0.80
  minimum-player-confidence: 0.80
  minimum-tps: 18.0

Punishments:
  Simulation:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.prediction.simulation"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Timer:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Timer"
      - "TimerLimit"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "25:25 [webhook]"
      - "25:25 [proxy]"
      - "1:0 if sanction_vl>=100 do kick %player% Timer abuse detected by SparkGrim."

  NetworkIntegrity:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "ConnectionStall"
      - "PacketBurst"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  GroundIntegrity:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "GroundSpoof"
      - "NoFall"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Knockback:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.velocity.anti_knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "1:0 if sanction_vl>=50 & integrity_score>=4.0 do kick %player% Invalid knockback detected by SparkGrim."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "1:0 if sanction_vl>=60 do kick %player% Invalid packet behavior detected by SparkGrim."
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "1:0 if sanction_vl>=60 do kick %player% Invalid packet behavior detected by SparkGrim."
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:3 [webhook]"
      - "3:3 [proxy]"
      - "1:0 if sanction_vl>=20 do kick %player% Invalid reach detected by SparkGrim."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "1:0 if sanction_vl>=30 do kick %player% Invalid hitbox interaction detected by SparkGrim."
  Misc:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Vehicle"
      - "stable:grim.movement.noslow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "StallActions"
      - "InventoryFrequency"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
      - "AttackBurst"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
  # Dês da 2.2.10, não temos verificações de AutoClicker, isso é somente um placeholder. Grim vai verificar por AutoClicker no futuro.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Regen:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Regen"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
