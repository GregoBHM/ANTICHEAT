# %check_name% - Name der Prüfung
# %description% - description of the check
# %vl% - Verstöße
# %verbose% - zusätzliche Informationen
# %player% - Spielername
# [alert] - spezieller Befehl zur Alarmierung
# [webhook] - spezieller Befehl für die Alarmierung an den Discord-Webhook
# [proxy] - spezieller Befehl zur Alarmierung anderer Server, die mit Ihrem Proxy verbunden sind (BungeeCord/Velocity)
# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
Punishments:
  Simulation:
    # Nach wie vielen Sekunden soll ein Verstoß entfernt werden?
    remove-violations-after: 300
    threshold-scope: check
    # In diesem Abschnitt werden alle Prüfungen mit dem Namen gefunden,
    # Um eine Prüfung auszuschließen, die sonst übereinstimmen würde, setzen Sie ein Ausrufezeichen vor den Namen
    # Zum Beispiel, !BadPacketsN
    checks:
      - "stable:grim.prediction.simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "ConnectionStall"
      - "PacketBurst"
      - "NoFall"
    # Schwellenwert:Intervall Befehl
    #
    # Beispiel, um den Spieler mit der Meldung "Falsche Bewegung!" nach 100 Verstößen zu kicken, ohne Intervall
    # Befehle:
    # - "100:0 kick %player% incorrect movement!"
    # 0 bedeutet genau einmal ausführen
    # - "100:50 say %player% is cheating"
    # Ausführen, wenn der Benutzer Flagge 100 trifft, und danach jede 50. Flagge nach 100
    #
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "50:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Unfair movement detected by SparkGrim."
  Knockback:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.velocity.anti_knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "25:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid knockback detected by SparkGrim."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "60:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid packet behavior detected by SparkGrim."
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "60:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid packet behavior detected by SparkGrim."
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:3 [webhook]"
      - "3:3 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid reach detected by SparkGrim."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "20:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid hitbox interaction detected by SparkGrim."
  Misc:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Vehicle"
      - "stable:grim.movement.noslow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "StallActions"
      - "InventoryFrequency"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "30:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid gameplay behavior detected by SparkGrim."
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
      - "AttackBurst"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid combat behavior detected by SparkGrim."
  # Ab 2.2.10 gibt es keine AutoClicker-Prüfungen mehr und dies ist ein Platzhalter. Grim wird in Zukunft AutoClicker-Prüfungen einbauen.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Regen:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Regen"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid regeneration detected by SparkGrim."
