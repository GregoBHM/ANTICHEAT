# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)

# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 300
    # Simulation/Timer/ConnectionStall/NoFall keep independent VL budgets.
    threshold-scope: check
    # This section will match all checks with the name,
    # To exclude a check that would otherwise be matched, put an exclamation mark in front of the name
    # For example, !BadPacketsN
    checks:
      - "stable:grim.prediction.simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "ConnectionStall"
      - "PacketBurst"
      - "NoFall"
    # Threshold:Interval Command
    #
    # N is the active violation count required to run the command.
    # Active violations are counted inside the remove-violations-after window.
    # M > 0 runs at N, then N+M, N+2M, ...
    # M = 0 runs once when N is reached.
    #
    # Examples:
    # - "100:0 kick %player% incorrect movement!"   fires once on flag 100
    # - "100:50 say %player% is cheating"           fires on flags 100, 150, 200, ...
    # - "5:3 [alert]"                               fires on flags 5, 8, 11, 14, ...
    #
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "50:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Unfair movement detected by SparkGrim."
  Knockback:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.velocity.anti_knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "25:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid knockback detected by SparkGrim."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "60:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid packet behavior detected by SparkGrim."
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "60:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid packet behavior detected by SparkGrim."
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:3 [webhook]"
      - "3:3 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid reach detected by SparkGrim."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "20:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid hitbox interaction detected by SparkGrim."
  Misc:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Vehicle"
      - "stable:grim.movement.noslow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "StallActions"
      - "InventoryFrequency"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "30:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid gameplay behavior detected by SparkGrim."
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
      - "AttackBurst"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid combat behavior detected by SparkGrim."
  # As of 2.2.10, there are no AutoClicker checks and this is a placeholder. Grim will include AutoClicker checks in the future.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Regen:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Regen"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid regeneration detected by SparkGrim."
