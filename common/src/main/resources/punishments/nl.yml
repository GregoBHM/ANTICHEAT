# %check_name% - naam van de controle
# %description% - description of the check
# %vl% - overtredingen
# %verbose% - extra informatie
# %player% - spelersnaam
# [alert] - speciaal commando om te waarschuwen
# [webhook] - speciaal commando om discord webhook te waarschuwen
# [proxy] - speciaal commando om te waarschuwen voor andere servers die verbonden zijn met je proxy (BungeeCord/Velocity)
# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
Punishments:
  Simulation:
    # Na hoeveel seconden moet een overtreding worden verwijderd?
    remove-violations-after: 300
    threshold-scope: check
    # Deze sectie zal overeenkomen met alle controles met de naam,
    # Om een controle uit te sluiten die anders wel overeen zou komen, zet je een uitroepteken voor de naam.
    # Bijvoorbeeld, !BadPacketsN
    checks:
      - "stable:grim.prediction.simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "ConnectionStall"
      - "PacketBurst"
      - "NoFall"
    # Drempel: Interval-commando
    #
    # Voorbeeld, om de speler te schoppen met het bericht "verkeerde beweging!" na 100 overtredingen, zonder interval
    # commando's:
    # - "100:0 kick %player% incorrecte beweging!"
    # 0 betekent precies één keer uitvoeren
    # - "100:50 say %player% is cheating"
    # Uitvoeren wanneer de gebruiker flag 100 raakt, en daarna elke 50e flag na 100
    #
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "50:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Unfair movement detected by SparkGrim."
  Knockback:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.velocity.anti_knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "25:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid knockback detected by SparkGrim."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "60:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid packet behavior detected by SparkGrim."
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:3 [webhook]"
      - "3:3 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid reach detected by SparkGrim."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "20:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid hitbox interaction detected by SparkGrim."
  Misc:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Vehicle"
      - "stable:grim.movement.noslow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "StallActions"
      - "InventoryFrequency"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      - "30:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid gameplay behavior detected by SparkGrim."
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
      - "AttackBurst"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid combat behavior detected by SparkGrim."
  # Vanaf 2.2.10 zijn er geen AutoClicker-controles en is dit een placeholder. Grim zal in de toekomst AutoClicker-controles toevoegen.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Regen:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Regen"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
      - "12:0 if confidence>=0.80 & server_confidence>=0.80 & player_confidence>=0.80 & tps>=18.0 do kick %player% Invalid regeneration detected by SparkGrim."
