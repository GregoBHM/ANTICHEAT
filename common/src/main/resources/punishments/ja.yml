# %check_name% – チェックの名前
# %description% - チェックの説明
# %vl% - 違反回数
# %verbose% - 追加情報
# %player% - プレイヤー名
# [alert] - アラート通知を行う特別なコマンド
# [webhook] - DiscordのWebhookに通知する特別なコマンド
# [proxy] - プロキシに接続された他のサーバーに通知する特別なコマンド（BungeeCord/Velocity用）
# Check selectors are backward compatible by canonical name.
# Use stable:<stable-key> for an exact cross-version selector.
# Canonical names always win over aliases; aliases never shadow real check names.
# Automatic sanctions use a separate high-confidence ledger. Raw VL/logs stay complete.
sanctions:
  minimum-confidence: 0.80
  minimum-server-confidence: 0.80
  minimum-player-confidence: 0.80
  minimum-tps: 18.0

Punishments:
  Simulation:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.prediction.simulation"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Timer:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Timer"
      - "TimerLimit"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "25:25 [webhook]"
      - "25:25 [proxy]"
      - "1:0 if sanction_vl>=100 do kick %player% Timer abuse detected by SparkGrim."

  NetworkIntegrity:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "ConnectionStall"
      - "PacketBurst"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  GroundIntegrity:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "GroundSpoof"
      - "NoFall"
    commands:
      - "5:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Knockback:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "stable:grim.velocity.anti_knockback"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      - "1:0 if sanction_vl>=50 & integrity_score>=4.0 do kick %player% Invalid knockback detected by SparkGrim."

  Explosion:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "BadPackets"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      - "1:0 if sanction_vl>=100 do kick %player% Invalid packet behavior detected by SparkGrim."

  PacketOrder:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "PacketOrder"
      - "Post"
    commands:
      - "10:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"

  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "3:3 [webhook]"
      - "3:3 [proxy]"
      - "1:0 if sanction_vl>=20 do kick %player% Invalid reach detected by SparkGrim."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      - "1:0 if sanction_vl>=30 do kick %player% Invalid hitbox interaction detected by SparkGrim."
  Misc:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Vehicle"
      - "stable:grim.movement.noslow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "Elytra"
      - "Chat"
      - "Exploit"
      - "StallActions"
      - "InventoryFrequency"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
      - "AttackBurst"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
  # バージョン2.2.10時点では、AutoClickerのチェックはまだなく、これはプレースホルダーです。Grimは将来的にAutoClickerのチェックを追加予定です。
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  Regen:
    remove-violations-after: 300
    threshold-scope: check
    checks:
      - "Regen"
    commands:
      - "3:3 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "10:10 [proxy]"
