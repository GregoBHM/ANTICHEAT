name: Branch validation

on:
  push:
    branches:
      - fix/item-use-detection-policy-v10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Targeted policy tests and Bukkit compile
        run: ./gradlew :common:test :bukkit:compileJava --no-daemon --stacktrace

      - name: Full build
        run: ./gradlew build --no-daemon --stacktrace
