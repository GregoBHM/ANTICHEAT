name: Validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test common and compile Bukkit
        run: ./gradlew :common:test :bukkit:compileJava --no-daemon --stacktrace

      - name: Full build
        run: ./gradlew build --no-daemon --stacktrace
